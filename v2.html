<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朝廷爭議 V2 - 現代討論組版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #b8860b;
            --ink-black: #1a1a1a;
            --paper-white: #fcfaf2;
            --a-color: #ffd700;
            --b-color: #3498db;
            --c-color: #95a5a6;
            --royal-gold: #f39c12;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--paper-white); color: var(--ink-black); font-family: 'Noto Serif TC', serif; overflow: hidden; height: 100vh; }
        #app { width: 100vw; height: 100vh; display: flex; flex-direction: column; position: relative; }
        .palace-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #fff 0%, #fcfaf2 100%); z-index: -2; }

        .status-bar { height: 50px; background: rgba(255,255,255,0.9); display: flex; justify-content: center; align-items: center; border-bottom: 1px solid #ddd; padding: 0 20px; z-index: 1000; }
        .stance-container { width: 40%; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; display: flex; }
        .stance { transition: width 0.8s ease; }
        .traditionalists { background: var(--b-color); }
        .reformists { background: #e74c3c; }

        .court-layout { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 30px; }
        .royal-row { display: flex; justify-content: center; align-items: center; gap: 40px; height: 150px; }
        
        .avatar-container { display: flex; flex-direction: column; align-items: center; gap: 8px; transition: all 0.3s; cursor: pointer; }
        .avatar-circle { 
            width: 80px; height: 80px; border-radius: 50%; 
            background-color: #fff; border: 3px solid #ddd;
            overflow: hidden; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
        }
        .character.active .avatar-circle { border-color: var(--royal-gold); transform: scale(1.2); box-shadow: 0 0 20px rgba(243,156,18,0.5); }
        .character.active .name-tag { background: var(--royal-gold); color: #fff; }

        .royal .avatar-circle { width: 100px; height: 100px; border-width: 4px; border-color: var(--royal-gold); }
        .avatar-img { 
            width: 100%; height: 100%; 
            background-image: url('characters_sheet.png');
            background-size: 900% 200%;
            image-rendering: auto;
            transform: scale(2.2) translateY(15px);
        }
        .avatar-img.bongnim { background-image: url('bongnim.png'); background-size: cover; transform: scale(1.2) translateY(5px); }
        .name-tag { font-size: 12px; font-weight: 900; background: #eee; padding: 2px 8px; border-radius: 10px; color: #666; transition: 0.3s; }

        .ministers-floor { display: flex; justify-content: space-around; flex: 1; align-items: flex-start; }
        .minister-group { display: flex; flex-direction: column; align-items: center; gap: 20px; flex: 1; }
        .group-label { font-size: 1rem; font-weight: 900; color: #999; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid #eee; width: 80%; text-align: center; padding-bottom: 5px; }
        .avatars-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
        .minister .avatar-circle { width: 60px; height: 60px; border-width: 2px; }
        .minister .avatar-img { transform: scale(2.5) translateY(12px); }

        .dialogue-center { height: 180px; display: flex; justify-content: center; align-items: center; padding: 0 20px 20px 20px; }
        .dialogue-box { 
            width: 100%; max-width: 800px; background: #fff; border-radius: 20px; 
            padding: 20px 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); 
            border: 1px solid #eee; cursor: pointer; text-align: center;
        }
        .speaker-name { color: var(--gold); font-size: 1.2rem; font-weight: 900; margin-bottom: 5px; }
        .speech-text { font-size: 1.5rem; line-height: 1.5; color: #333; }

        .term { color: var(--gold); border-bottom: 1px solid var(--gold); cursor: help; }
        #wiki-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 400px; background: #fff; border-radius: 20px; padding: 30px;
            z-index: 5000; display: none; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        #wiki-modal h2 { color: var(--gold); margin-bottom: 15px; }
        #wiki-close { margin-top: 20px; background: var(--gold); color: #fff; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.2); z-index: 4999; display: none; }
    </style>
</head>
<body>
    <div id="app">
        <div class="palace-bg"></div>
        <header class="status-bar">
            <div class="stance-container">
                <div class="stance traditionalists" id="bar-traditional" style="width: 50%;"></div>
                <div class="stance reformists" id="bar-reform" style="width: 50%;"></div>
            </div>
        </header>
        
        <main class="court-layout">
            <div class="royal-row">
                <div class="character royal" id="char-king"><div class="avatar-circle"><div class="avatar-img" style="background-position: 0% 0%;"></div></div><div class="name-tag">仁祖</div></div>
                <div class="character royal" id="char-bongnim"><div class="avatar-circle"><div class="avatar-img bongnim"></div></div><div class="name-tag">鳳林大君</div></div>
                <div class="character royal" id="char-inpyeong"><div class="avatar-circle"><div class="avatar-img" style="background-position: 50% 100%;"></div></div><div class="name-tag">麟坪大君</div></div>
                <div class="character royal" id="char-sesun"><div class="avatar-circle"><div class="avatar-img" style="background-position: 25% 100%;"></div></div><div class="name-tag">世孫</div></div>
            </div>

            <div class="ministers-floor">
                <div class="minister-group" id="group-b"><div class="group-label">守經主力</div><div class="avatars-grid" id="min-b"></div></div>
                <div class="minister-group" id="group-a"><div class="group-label">權力核心</div><div class="avatars-grid" id="min-a"></div></div>
                <div class="minister-group" id="group-c"><div class="group-label">其他參與</div><div class="avatars-grid" id="min-c"></div></div>
            </div>

            <div class="dialogue-center">
                <section class="dialogue-box" id="dialogue-box">
                    <div class="speaker-name" id="speaker">宮廷史官</div>
                    <div class="speech-text" id="speech">點擊開始對話。</div>
                </section>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="wiki-overlay"></div>
    <div id="wiki-modal">
        <h2 id="wiki-title">人物名稱</h2>
        <p id="wiki-content">歷史信息...</p>
        <button id="wiki-close">關閉</button>
    </div>

    <script>
        const wikiData = {
            "元孫": "即昭顯世子之長子。在本次爭議中，仁祖試圖跳過他，改立次子鳳林大君。",
            "世孫": "即元孫。在歷史原文中多稱為元孫或世孫。",
            "鳳林大君": "仁祖次子，後來的朝鮮孝宗。",
            "麟坪大君": "仁祖三子。在繼承人爭議中亦曾被提及，但他本人並未主動參與爭權。",
            "德宗": "世祖長子。仁祖引用他的先例來支持擇立長君。",
            "昭顯世子": "仁祖長子，於瀋陽回國後不久神祕死亡。"
        };

        const dialogue = [
            { speaker: "上", text: "予有宿疾，往往而劇，元孫如彼其微弱。予觀今日之形勢，不可以待小兒之成長。未知卿等之意以爲何如？", stance: 0 },
            { speaker: "瑬", text: "朝野方頌岡陵之祝，而殿下遽出此言，臣等罔知所達。", stance: -5 },
            { speaker: "上", text: "非徒疾病如此，國事日阽於艱危，脱有不諱，幼沖之主恐不能擔當大器。予欲於大君中擇立爾。", stance: 10 },
            { speaker: "瑬", text: "今此下教，雖出於爲宗社之大計，而臣等惶惑不知所言，宜博詢諸臣。", stance: 0 },
            { speaker: "瑞鳳", text: "考諸往牒，太子不在，繼以太孫，此乃不易之常經。反常行權，恐非國家之福。", stance: -15 },
            { speaker: "上", text: "雖在治平之世，必以國有長君爲福，况今日乎？", stance: 5 },
            { speaker: "悦", text: "瑞鳳之言，正合臣意。殿下雖有微恙，春秋鼎盛，元孫雖曰微弱，已至十歲。宗統甚重，恐不可輕議也。", stance: -10 },
            { speaker: "自點", text: "殿下以疾病之未平、時事之艱虞，爲宗社、生民之大計，而發此言，宜更詢于諸臣而決之。", stance: 0 },
            { speaker: "敬輿", text: "臣之愚見，與瑞鳳無異。世嫡承統，今古之常經，常經之外更無所陳。今者擧國之係望於元孫已久，若聞此言，則中外人心，必皆波蕩，甚可懼也。", stance: -20 },
            { speaker: "上", text: "我世祖不傳於元孫，傳於睿宗，當時朝臣無異議，果皆不忠者耶？大臣當國家之大事，宜任其責，而徒以循常之談，爲塞責之地，此豈大臣之道耶？", stance: 15 },
            { speaker: "上", text: "（謂瑬曰）此事專在於領相，卿其決之。", stance: 5 },
            { speaker: "瑬", text: "臣雖忝首相，顧安敢獨斷乎？今日之擧，未見其必係於存亡，而欲行非常之道，此臣等之所以不敢輕議也。", stance: -10 },
            { speaker: "上", text: "古之大臣擔當國事，不知有其身。今卿等知其可，而不肯言，何也？", stance: 15 },
            { speaker: "瑬", text: "德宗在東宮，昇遐於天順丁丑，而睿宗繼統於戊子... 光廟之建儲如此，未知何故也。", stance: -5 },
            { speaker: "上", text: "月山大君則性質不慧云，而當時成宗之年，亦已過十歲耶？", stance: 5 },
            { speaker: "瑬", text: "成宗生於丁丑德宗升遐之歲，故逮戊子世祖升遐之日，年十二矣。", stance: -5 },
            { speaker: "上", text: "以序言之，則當立者月山，而事有隨時變通者，故不得不如此爾。", stance: 15 },
            { speaker: "瑬", text: "當世祖之世，國家無事，而有此反常之擧，此蓋出於擇賢耶？", stance: -5 },
            { speaker: "上", text: "世祖朝事，多危疑，故必欲立長君。予亦豈不知循序之爲至順也？第惟今日之勢，必須國有長君，然後可以保宗社之重也。", stance: 20 },
            { speaker: "德泂", text: "臣之意，亦以瑞鳳之言爲然也。", stance: -5 },
            { speaker: "仁垕", text: "殿下之意，為宗社之大計，惟在聖斷耳。", stance: 15 },
            { speaker: "時白", text: "洪、李二大臣之言，俱是經常之道，臣則以兩臣之意爲然也。", stance: -10 },
            { speaker: "景奭", text: "若一行處變之擧，而反致四方之疑惑，則雖以利害言之，亦不知其可也。", stance: -10 },
            { speaker: "植", text: "書生之見，只守常道，寧知權變？", stance: -10 },
            { speaker: "上", text: "所謂書生，平日讀書，而不知用權之道，則雖腹有詩書，亦安用哉？", stance: 20 },
            { speaker: "植", text: "臣恐不守經，則反不得安也。", stance: -5 },
            { speaker: "爾徵", text: "宗社之計，須與大臣議定，必欲問臣，但有守經而已。", stance: -15 },
            { speaker: "自點", text: "此舉出於聖上之深思慮，宜速斷定，何必持難耶？", stance: 20 },
            { speaker: "上", text: "大臣之議，每以經常二字為執言之地，含糊傳會。棄職而去宜矣！士君子行己處心，豈可如是黠鼠耶？", stance: 20 },
            { speaker: "悦", text: "以經常言之，則臣民之屬望，自有所載。不意今日有此非常之舉，故臣等之言如是矣。若以為宗社臣民，必如是而可安，則亦豈無行權之道乎？時任大臣及元勳皆在此，可以更詢而決之也。", stance: -10 },
            { speaker: "敬輿", text: "上意雖以元孫之幼沖，思得長君，而非常之舉，豈敢易議？且論其長幼，不若論其賢否。今也聖教，不及於元孫之賢否，而只以長幼為言。自古幼年嗣位，成德保邦者，亦非一二，豈可以年之幼沖，而輕易廢立耶？", stance: -20 },
            { speaker: "敬輿", text: "元孫之在膝下已久，其賢不肖，想已洞燭，而外庭之臣無由得知。今日臣民，皆已屬望於元孫，知有世嫡之當承而已。若反常行權，而宗社永賴，則其在古昔，亦有此事，帝王經常之典，臣亦知其不可膠守矣。", stance: -15 },
            { speaker: "悦", text: "今日諸臣之所以持難不決者，非過也。世子既沒，則當繼者元孫也。國本之易樹，豈可立決於一言乎？", stance: -10 },
            { speaker: "德泂", text: "既正元孫之名，又立輔養之官，則位號之定久矣。經常不易之典，可考信於往牒也。人臣之道，猝當反常之舉，當以守經爭之乎，抑將以處權順之乎？今日聖教，雖以宗社之計為言，而猝然一朝，欲易已正之名號，群臣若靡然從之，則將焉用彼臣為哉？", stance: -20 },
            { speaker: "上", text: "（默然良久曰）大臣之意，則皆歸於一耶？", stance: 0 },
            { speaker: "瑬", text: "似無異議也。", stance: 10 },
            { speaker: "上", text: "不幸諸子皆沒，只有二人，大臣擇賢而定之。此非嫡長之比，唯當擇其賢耳。", stance: 15 },
            { speaker: "瑞鳳", text: "大君與朝臣，無相接之事，何能知其優劣乎？古人云：『知子莫如父。』此在睿斷而已。", stance: 5 },
            { speaker: "上", text: "二人皆劣，無所取舍。予欲立長，未知何如？", stance: 20 },
            { speaker: "瑬", text: "立嫡以長，順也。", stance: 10 },
            { speaker: "上", text: "然。清使將來，必問國本，故不得不急急議定耳。", stance: 15 },
            { speaker: "瑬", text: "此外更無可議，須明白下教，使群臣明知之。", stance: 10 },
            { speaker: "上", text: "以鳳林大君為世子。", stance: 30 },
            { speaker: "自點", text: "當捧承傳乎？", stance: 20 },
            { speaker: "史官", text: "（左右竊笑）上曰：『無庸為也學。』瑬請令禮曹奉行，上曰：『徐為之未晚也。』", stance: 0 }
        ];

        const ministersData = {
            "瑬": { px: '12.5%', py: '0%', group: 'a' },
            "自點": { px: '50%', py: '0%', group: 'a' },
            "瑞鳳": { px: '25%', py: '0%', group: 'b' },
            "敬輿": { px: '62.5%', py: '0%', group: 'b' },
            "景奭": { px: '75%', py: '100%', group: 'b' },
            "堉": { px: '100%', py: '0%', group: 'b' },
            "悦": { px: '37.5%', py: '0%', group: 'c' },
            "壽賢": { px: '87.5%', py: '0%', group: 'c' },
            "太和": { px: '0%', py: '100%', group: 'c' },
            "楘": { px: '100%', py: '100%', group: 'c' },
            "爾徵": { px: '25%', py: '100%', group: 'c' },
            "德泂": { px: '37.5%', py: '100%', group: 'c' },
            "仁垕": { px: '50%', py: '100%', group: 'c' },
            "時白": { px: '62.5%', py: '100%', group: 'c' },
            "植": { px: '75%', py: '0%', group: 'c' }
        };

        let currentIndex = -1;
        let currentStanceBalance = 50;

        function showWiki(term) {
            if (wikiData[term]) {
                document.getElementById('wiki-title').innerText = term;
                document.getElementById('wiki-content').innerText = wikiData[term];
                document.getElementById('wiki-modal').style.display = 'block';
                document.getElementById('wiki-overlay').style.display = 'block';
            }
        }

        function closeWiki() {
            document.getElementById('wiki-modal').style.display = 'none';
            document.getElementById('wiki-overlay').style.display = 'none';
        }

        function formatText(text) {
            let formatted = text;
            Object.keys(wikiData).forEach(term => {
                formatted = formatted.replace(new RegExp(term, 'g'), `<span class="term" onclick="event.stopPropagation(); showWiki('${term}')">${term}</span>`);
            });
            return formatted;
        }

        function init() {
            Object.keys(ministersData).forEach(name => {
                const data = ministersData[name];
                const grid = document.getElementById('min-' + data.group);
                const div = document.createElement('div');
                div.className = 'character minister avatar-container';
                div.id = `char-${name}`;
                div.innerHTML = `<div class="avatar-circle"><div class="avatar-img" style="background-position: ${data.px} ${data.py}"></div></div><div class="name-tag">${name}</div>`;
                grid.appendChild(div);
            });
            document.getElementById('dialogue-box').addEventListener('click', nextDialogue);
            document.getElementById('wiki-close').addEventListener('click', closeWiki);
            document.getElementById('wiki-overlay').addEventListener('click', closeWiki);
        }

        function nextDialogue() {
            currentIndex++;
            if (currentIndex >= dialogue.length) return;
            const entry = dialogue[currentIndex];
            document.getElementById('speaker').innerText = entry.speaker;
            document.getElementById('speech').innerHTML = formatText(entry.text);
            document.querySelectorAll('.character').forEach(c => c.classList.remove('active'));
            if (entry.speaker === "上") document.getElementById('char-king').classList.add('active');
            else if (ministersData[entry.speaker]) document.getElementById(`char-${entry.speaker}`).classList.add('active');
            if (entry.text.includes("鳳林大君")) document.getElementById('char-bongnim').classList.add('active');
            if (entry.text.includes("元孫") || entry.text.includes("世孫")) document.getElementById('char-sesun').classList.add('active');
            currentStanceBalance += (entry.stance || 0);
            currentStanceBalance = Math.max(10, Math.min(90, currentStanceBalance));
            document.getElementById('bar-traditional').style.width = (100 - currentStanceBalance) + '%';
            document.getElementById('bar-reform').style.width = currentStanceBalance + '%';
        }
        window.onload = init;
    </script>
</body>
</html>
