<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朝廷爭議 V2 - 現代討論組 V3</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #b8860b;
            --ink-black: #1a1a1a;
            --paper-white: #fcfaf2;
            --a-color: #ffd700;
            --b-color: #3498db;
            --c-color: #95a5a6;
            --royal-gold: #f39c12;
            --angry-red: #ff3f34;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--paper-white); color: var(--ink-black); font-family: 'Noto Serif TC', serif; overflow: hidden; height: 100vh; }
        #app { width: 100vw; height: 100vh; display: flex; flex-direction: column; position: relative; }
        .palace-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #fff 0%, #fcfaf2 100%); z-index: -2; }

        /* 震怒動畫：屏幕抖動 */
        @keyframes screen-shake {
            0% { transform: translate(0,0); }
            10% { transform: translate(-5px,-5px); }
            20% { transform: translate(5px,5px); }
            30% { transform: translate(-5px,5px); }
            40% { transform: translate(5px,-5px); }
            50% { transform: translate(0,0); }
        }
        .shake-screen { animation: screen-shake 0.3s ease-in-out infinite; }

        /* 震怒動畫：頭像紅光脈衝 */
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0px var(--angry-red); }
            50% { box-shadow: 0 0 30px var(--angry-red); }
            100% { box-shadow: 0 0 0px var(--angry-red); }
        }
        .angry-pulse .avatar-circle { animation: pulse-red 0.5s infinite; border-color: var(--angry-red) !important; }

        .status-bar { height: 50px; background: rgba(255,255,255,0.9); display: flex; justify-content: center; align-items: center; border-bottom: 1px solid #ddd; padding: 0 20px; z-index: 1000; }
        .stance-container { width: 40%; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; display: flex; }
        .stance { transition: width 0.8s ease; }
        .traditionalists { background: var(--b-color); }
        .reformists { background: #e74c3c; }

        .court-layout { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 30px; transition: transform 0.1s; }
        
        /* 皇室區域 - 統一 120px */
        .royal-row { display: flex; justify-content: center; align-items: center; gap: 50px; height: 180px; }
        .avatar-container { display: flex; flex-direction: column; align-items: center; gap: 12px; transition: all 0.3s; cursor: pointer; }
        .avatar-circle { 
            width: 90px; height: 90px; border-radius: 50%; 
            background-color: #fff; border: 3px solid #ddd;
            overflow: hidden; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
        }
        .royal .avatar-circle { width: 120px; height: 120px; border-width: 5px; border-color: var(--royal-gold); }
        
        .character.active .avatar-circle { transform: scale(1.1); box-shadow: 0 0 25px rgba(243,156,18,0.4); border-color: var(--royal-gold); }
        .character.active .name-tag { background: var(--royal-gold); color: #fff; }

        .avatar-img { 
            width: 100%; height: 100%; 
            background-image: url('characters_sheet.png');
            background-size: 900% 200%;
            transform: scale(2.2) translateY(15px);
        }
        .avatar-img.bongnim { background-image: url('bongnim.png'); background-size: cover; transform: scale(1.1) translateY(5px); }
        .avatar-img.inpyeong { background-image: url('inpyeong.png'); background-size: cover; transform: scale(1.1) translateY(5px); }

        .name-tag { font-size: 16px; font-weight: 900; background: #eee; padding: 4px 15px; border-radius: 15px; color: #444; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        /* 大臣區域 - 統一 90px */
        .ministers-floor { display: flex; justify-content: space-around; flex: 1; align-items: flex-start; }
        .minister-group { display: flex; flex-direction: column; align-items: center; gap: 20px; flex: 1; }
        .group-label { font-size: 1.1rem; font-weight: 900; color: #aaa; text-transform: uppercase; letter-spacing: 2px; border-bottom: 2px solid #eee; width: 85%; text-align: center; padding-bottom: 8px; }
        .avatars-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        
        .minister .avatar-circle { width: 90px; height: 90px; }
        .minister .avatar-img { transform: scale(2.5) translateY(12px); }

        /* 對話框 */
        .dialogue-center { height: 200px; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .dialogue-box { 
            width: 100%; max-width: 850px; background: #fff; border-radius: 25px; 
            padding: 25px 50px; box-shadow: 0 15px 50px rgba(0,0,0,0.08); 
            border: 1px solid #eee; cursor: pointer; text-align: center;
        }
        .speaker-name { color: var(--gold); font-size: 1.4rem; font-weight: 900; margin-bottom: 8px; }
        .speech-text { font-size: 1.7rem; line-height: 1.5; color: #222; }

        .term { color: var(--gold); border-bottom: 1px solid var(--gold); cursor: help; }
        #wiki-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 450px; background: #fff; border-radius: 25px; padding: 35px;
            z-index: 5000; display: none; box-shadow: 0 25px 70px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="palace-bg"></div>
        <header class="status-bar">
            <div class="stance-container">
                <div class="stance traditionalists" id="bar-traditional" style="width: 50%;"></div>
                <div class="stance reformists" id="bar-reform" style="width: 50%;"></div>
            </div>
        </header>
        
        <main class="court-layout" id="main-stage">
            <div class="royal-row">
                <div class="character royal" id="char-king"><div class="avatar-circle"><div class="avatar-img" style="background-position: 0% 0%;"></div></div><div class="name-tag">仁祖</div></div>
                <div class="character royal" id="char-bongnim"><div class="avatar-circle"><div class="avatar-img bongnim"></div></div><div class="name-tag">鳳林大君</div></div>
                <div class="character royal" id="char-inpyeong"><div class="avatar-circle"><div class="avatar-img inpyeong"></div></div><div class="name-tag">麟坪大君</div></div>
                <div class="character royal" id="char-sesun"><div class="avatar-circle"><div class="avatar-img" style="background-position: 25% 100%;"></div></div><div class="name-tag">世孫</div></div>
            </div>

            <div class="ministers-floor">
                <div class="minister-group" id="group-b"><div class="group-label">守經主力</div><div class="avatars-grid" id="min-b"></div></div>
                <div class="minister-group" id="group-a"><div class="group-label">權力核心</div><div class="avatars-grid" id="min-a"></div></div>
                <div class="minister-group" id="group-c"><div class="group-label">其他參與</div><div class="avatars-grid" id="min-c"></div></div>
            </div>

            <div class="dialogue-center">
                <section class="dialogue-box" id="dialogue-box">
                    <div class="speaker-name" id="speaker">宮廷史官</div>
                    <div class="speech-text" id="speech">點擊屏幕開始這場決定宗社命運的博弈。</div>
                </section>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="wiki-overlay" onclick="closeWiki()"></div>
    <div id="wiki-modal">
        <h2 id="wiki-title">人物名稱</h2>
        <p id="wiki-content">歷史信息...</p>
        <button id="wiki-close" onclick="closeWiki()">關閉</button>
    </div>

    <script>
        const wikiData = {
            "元孫": "即昭顯世子之長子。按照『世嫡承統』原則應繼位，但仁祖欲改立鳳林大君。",
            "世孫": "即元孫。在本文中指昭顯世子之子。",
            "鳳林大君": "仁祖次子，後來的朝鮮孝宗。他在瀋陽質留多年，支持北伐。",
            "麟坪大君": "仁祖三子，以書畫藝術見長。在繼承人爭議中保持低調，是皇室中的重要成員。",
            "德宗": "世祖長子懿敬世子。其早逝導致世祖改立次子睿宗，是仁祖引用最重要的先例。"
        };

        const dialogue = [
            { speaker: "上", text: "予有宿疾，往往而劇，元孫如彼其微弱。予觀今日之形勢，不可以待小兒之成長。未知卿等之意以爲何如？", mood: 20 },
            { speaker: "瑬", text: "朝野方頌岡陵之祝，而殿下遽出此言，臣等罔知所達。", mood: 10 },
            { speaker: "上", text: "非徒疾病如此，國事日阽於艱危，脱有不諱，幼沖之主恐不能擔當大器。予欲於大君中擇立爾。", mood: 40 },
            { speaker: "瑬", text: "今此下教，雖出於爲宗社之大計，而臣等惶惑不知所言，宜博詢諸臣。", mood: 20 },
            { speaker: "瑞鳳", text: "考諸往牒，太子不在，繼以太孫，此乃不易之常經。反常行權，恐非國家之福。", mood: 30 },
            { speaker: "上", text: "雖在治平之世，必以國有長君爲福，况今日乎？", mood: 50 },
            { speaker: "悦", text: "瑞鳳之言，正合臣意。殿下雖有微恙，春秋鼎盛，元孫雖曰微弱，已至十歲。宗統甚重，恐不可輕議也。", mood: 40 },
            { speaker: "自點", text: "殿下以疾病之未平、時事之艱虞，爲宗社、生民之大計，而發此言，宜更詢于諸臣而決之。", mood: 30 },
            { speaker: "敬輿", text: "臣之愚見，與瑞鳳無異。世嫡承統，今古之常經，常經之外更無所陳。今者擧國之係望於元孫已久，若聞此言，則中外人心，必皆波蕩，甚可懼也。", mood: 60 },
            { speaker: "上", text: "我世祖不傳於元孫，傳於睿宗，當時朝臣無異議，果皆不忠者耶？大臣當國家之大事，宜任其責，而徒以循常之談，爲塞責之地，此豈大臣之道耶？", mood: 85 },
            { speaker: "上", text: "此事專在於領相，卿其決之。", mood: 95 },
            { speaker: "瑬", text: "臣雖忝首相，顧安敢獨斷乎？今日之擧，未見其必係於存亡，而欲行非常之道，此臣等之所以不敢輕議也。", mood: 80 },
            { speaker: "上", text: "古之大臣擔當國事，不知有其身。今卿等知其可，而不肯言，何也？", mood: 100 },
            { speaker: "瑬", text: "德宗在東宮，昇遐於天順丁丑，而睿宗繼統於戊子... 光廟之建儲如此，未知何故也。", mood: 70 },
            { speaker: "上", text: "月山大君則性質不慧云，而當時成宗之年，亦已過十歲耶？", mood: 70 },
            { speaker: "瑬", text: "成宗生於丁丑德宗升遐之歲，故逮戊子世祖升遐之日，年十二矣。", mood: 70 },
            { speaker: "上", text: "以序言之，則當立者月山，而事有隨時變通者，故不得不如此爾。", mood: 80 },
            { speaker: "瑬", text: "當世祖之世，國家無事，而有此反常之擧，此蓋出於擇賢耶？", mood: 85 },
            { speaker: "上", text: "世祖朝事，多危疑，故必欲立長君。予亦豈不知循序之爲至順也？第惟今日之勢，必須國有長君，然後可以保宗社之重也。", mood: 90 },
            { speaker: "德泂", text: "臣之意，亦以瑞鳳之言爲然也。", mood: 95 },
            { speaker: "仁垕", text: "殿下之意，為宗社之大計，惟在聖斷耳。", mood: 90 },
            { speaker: "時白", text: "洪、李二大臣之言，俱是經常之道，臣則以兩臣之意爲然也。", mood: 90 },
            { speaker: "景奭", text: "若一行處變之擧，而反致四方之疑惑，則雖以利害言之，亦不知其可也。", mood: 100 },
            { speaker: "植", text: "書生之見，只守常道，寧知權變？", mood: 100 },
            { speaker: "上", text: "所謂書生，平日讀書，而不知用權之道，則雖腹有詩書，亦安用哉？", mood: 100 },
            { speaker: "植", text: "臣恐不守經，則反不得安也。", mood: 100 },
            { speaker: "爾徵", text: "宗社之計，須與大臣議定，必欲問臣，但有守經而已。", mood: 100 },
            { speaker: "自點", text: "此舉出於聖上之深思慮，宜速斷定，何必持難耶？", mood: 80 },
            { speaker: "上", text: "大臣之議，每以經常二字為執言之地，含糊傳會。棄職而去宜矣！士君子行己處心，豈可如是黠鼠耶？", mood: 110 },
            { speaker: "悦", text: "以經常言之，則臣民之屬望，自有所載。不意今日有此非常之舉，故臣等之言如是矣。若以為宗社臣民，必如是而可安，則亦豈無行權之道乎？時任大臣及元勳皆在此，可以更詢而決之也。", mood: 90 },
            { speaker: "敬輿", text: "上意雖以元孫之幼沖，思得長君，而非常之舉，豈敢易議？且論其長幼，不若論其賢否。今也聖教，不及於元孫之賢否，而只以長幼為言。自古幼年嗣位，成德保邦者，亦非一二，豈可以年之幼沖，而輕易廢立耶？", mood: 85 },
            { speaker: "敬輿", text: "元孫之在膝下已久，其賢不肖，想已洞燭，而外庭之臣無由得知。今日臣民，皆已屬望於元孫，知有世嫡之當承而已。若反常行權，而宗社永賴，則其在古昔，亦有此事，帝王經常之典，臣亦知其不可膠守矣。", mood: 85 },
            { speaker: "悦", text: "今日諸臣之所以持難不決者，非過也。世子既沒，則當繼者元孫也。國本之易樹，豈可立決於一言乎？", mood: 85 },
            { speaker: "德泂", text: "既正元孫之名，又立輔養之官，則位號之定久矣。經常不易之典，可考信於往牒也。人臣之道，猝當反常之舉，當以守經爭之乎，抑將以處權順之乎？今日聖教，雖以宗社之計為言，而猝然一朝，欲易已正之名號，群臣若靡然從之，則將焉用彼臣為哉？", mood: 95 },
            { speaker: "上", text: "（默然良久曰）大臣之意，則皆歸於一耶？", mood: 50 },
            { speaker: "瑬", text: "似無異議也。", mood: 40 },
            { speaker: "上", text: "不幸諸子皆沒，只有二人，大臣擇賢而定之。此非嫡長之比，唯當擇其賢耳。", mood: 60 },
            { speaker: "瑞鳳", text: "大君與朝臣，無相接之事，何能知其優劣乎？古人云：『知子莫如父。』此在睿斷而已。", mood: 50 },
            { speaker: "上", text: "二人皆劣，無所取舍。予欲立長，未知何如？", mood: 85 },
            { speaker: "瑬", text: "立嫡以長，順也。", mood: 60 },
            { speaker: "上", text: "然。清使將來，必問國本，故不得不急急議定耳。", mood: 80 },
            { speaker: "瑬", text: "此外更無可議，須明白下教，使群臣明知之。", mood: 70 },
            { speaker: "上", text: "以鳳林大君為世子。", mood: 90 },
            { speaker: "自點", text: "當捧承傳乎？", mood: 30 },
            { speaker: "史官", text: "（左右竊笑）上曰：『無庸為也。』瑬請令禮曹奉行，上曰：『徐為之未晚也。』", mood: 20 }
        ];

        const ministersData = {
            "瑬": { px: '12.5%', py: '0%', group: 'a' },
            "自點": { px: '50%', py: '0%', group: 'a' },
            "瑞鳳": { px: '25%', py: '0%', group: 'b' },
            "敬輿": { px: '62.5%', py: '0%', group: 'b' },
            "景奭": { px: '75%', py: '100%', group: 'b' },
            "堉": { px: '100%', py: '0%', group: 'b' },
            "悦": { px: '37.5%', py: '0%', group: 'c' },
            "壽賢": { px: '87.5%', py: '0%', group: 'c' },
            "太和": { px: '0%', py: '100%', group: 'c' },
            "楘": { px: '100%', py: '100%', group: 'c' },
            "爾徵": { px: '25%', py: '100%', group: 'c' },
            "德泂": { px: '37.5%', py: '100%', group: 'c' },
            "仁垕": { px: '50%', py: '100%', group: 'c' },
            "時白": { px: '62.5%', py: '100%', group: 'c' },
            "植": { px: '75%', py: '0%', group: 'c' }
        };

        let currentIndex = -1;
        function showWiki(term) {
            document.getElementById('wiki-title').innerText = term;
            document.getElementById('wiki-content').innerText = wikiData[term];
            document.getElementById('wiki-modal').style.display = 'block';
            document.getElementById('wiki-overlay').style.display = 'block';
        }
        function closeWiki() {
            document.getElementById('wiki-modal').style.display = 'none';
            document.getElementById('wiki-overlay').style.display = 'none';
        }
        function formatText(text) {
            let res = text;
            Object.keys(wikiData).forEach(k => {
                res = res.replace(new RegExp(k, 'g'), `<span class="term" onclick="event.stopPropagation(); showWiki('${k}')">${k}</span>`);
            });
            return res;
        }

        function init() {
            Object.keys(ministersData).forEach(name => {
                const data = ministersData[name];
                const grid = document.getElementById('min-' + data.group);
                const div = document.createElement('div');
                div.className = 'character minister avatar-container';
                div.id = `char-${name}`;
                div.innerHTML = `<div class="avatar-circle"><div class="avatar-img" style="background-position: ${data.px} ${data.py}"></div></div><div class="name-tag">${name}</div>`;
                grid.appendChild(div);
            });
            document.getElementById('dialogue-box').addEventListener('click', nextDialogue);
        }

        function nextDialogue() {
            currentIndex++;
            if (currentIndex >= dialogue.length) return;
            const entry = dialogue[currentIndex];
            const speakerEl = document.getElementById('speaker');
            const speechEl = document.getElementById('speech');
            const stage = document.getElementById('main-stage');
            
            speakerEl.innerText = entry.speaker;
            speechEl.innerHTML = formatText(entry.text);
            
            document.querySelectorAll('.character').forEach(c => {
                c.classList.remove('active');
                c.classList.remove('angry-pulse');
            });
            stage.classList.remove('shake-screen');

            let activeChar = null;
            if (entry.speaker === "上") activeChar = document.getElementById('char-king');
            else if (ministersData[entry.speaker]) activeChar = document.getElementById(`char-${entry.speaker}`);
            
            if (activeChar) {
                activeChar.classList.add('active');
                if (entry.mood >= 90) {
                    activeChar.classList.add('angry-pulse');
                    stage.classList.add('shake-screen');
                    setTimeout(() => stage.classList.remove('shake-screen'), 500);
                }
            }

            if (entry.text.includes("鳳林大君")) document.getElementById('char-bongnim').classList.add('active');
            if (entry.text.includes("麟坪大君")) document.getElementById('char-inpyeong').classList.add('active');
            if (entry.text.includes("元孫") || entry.text.includes("世孫")) document.getElementById('char-sesun').classList.add('active');
        }
        window.onload = init;
    </script>
</body>
</html>
