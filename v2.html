<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朝廷爭議 V2 - 逆轉裁判版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #b8860b;
            --ink-black: #1a1a1a;
            --paper-white: #fcfaf2;
            --royal-gold: #f39c12;
            --angry-red: #ff3f34;
            --objection-gold: #ffcc00;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--paper-white); color: var(--ink-black); font-family: 'Noto Serif TC', serif; overflow: hidden; height: 100vh; }
        #app { width: 100vw; height: 100vh; display: flex; flex-direction: column; position: relative; }
        
        /* 速度線背景 */
        .speed-lines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.8) 100%),
                             repeating-conic-gradient(from 0deg, transparent 0deg 1deg, rgba(255,255,255,0.1) 1deg 2deg);
            z-index: -1; opacity: 0; transition: opacity 0.2s;
        }
        .speed-lines.active { opacity: 1; }

        .palace-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #fff 0%, #fcfaf2 100%); z-index: -2; }

        /* 「不可！」衝擊氣泡 */
        #objection-bubble {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            font-size: 15rem; font-weight: 900; color: var(--angry-red);
            text-shadow: 10px 10px 0px #fff, -5px -5px 0px #fff, 0 0 50px rgba(255,0,0,0.5);
            z-index: 10000; pointer-events: none; transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-style: italic; font-family: 'Noto Serif TC', serif;
        }
        #objection-bubble.show { transform: translate(-50%, -50%) scale(1); }

        /* 閃光效果 */
        #flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9999; opacity: 0; pointer-events: none; }
        .flash-active { animation: flash-anim 0.3s forwards; }
        @keyframes flash-anim { 0% { opacity: 1; } 100% { opacity: 0; } }

        @keyframes screen-shake {
            0%, 100% { transform: translate(0,0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-8px,-8px); }
            20%, 40%, 60%, 80% { transform: translate(8px,8px); }
        }
        .shake-screen { animation: screen-shake 0.4s ease-in-out; }

        .status-bar { height: 40px; background: rgba(255,255,255,0.9); display: flex; justify-content: center; align-items: center; border-bottom: 1px solid #ddd; z-index: 1000; }
        .stance-container { width: 30%; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; display: flex; }
        .stance { transition: width 0.8s ease; }
        .traditionalists { background: #3498db; }
        .reformists { background: #e74c3c; }

        .court-layout { flex: 1; display: flex; flex-direction: column; padding: 10px; gap: 20px; }
        
        .royal-row { display: flex; justify-content: center; align-items: center; gap: 40px; height: 160px; }
        .avatar-container { display: flex; flex-direction: column; align-items: center; gap: 10px; transition: all 0.2s; }
        .avatar-circle { 
            width: 90px; height: 90px; border-radius: 50%; 
            background: #fff; border: 3px solid #ddd; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .royal .avatar-circle { width: 130px; height: 130px; border-width: 5px; border-color: var(--royal-gold); }
        .character.active .avatar-circle { transform: scale(1.1); border-color: var(--royal-gold); box-shadow: 0 0 30px rgba(243,156,18,0.5); }
        
        .avatar-img { 
            width: 100%; height: 100%; background-image: url('characters_sheet.png'); background-size: 900% 200%;
            transform: scale(2.2) translateY(15px);
        }
        .avatar-img.bongnim { background-image: url('bongnim.png'); background-size: cover; transform: scale(1.1) translateY(5px); }
        .avatar-img.inpyeong { background-image: url('inpyeong.png'); background-size: cover; transform: scale(1.1) translateY(5px); }
        .name-tag { font-size: 14px; font-weight: 900; background: #eee; padding: 2px 12px; border-radius: 12px; }

        .ministers-floor { display: flex; justify-content: space-around; flex: 1; }
        .minister-group { display: flex; flex-direction: column; align-items: center; gap: 10px; flex: 1; }
        .avatars-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
        .minister .avatar-circle { width: 85px; height: 85px; }

        .dialogue-center { height: 220px; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .dialogue-box { 
            width: 100%; max-width: 900px; background: rgba(255,255,255,0.95); border-radius: 15px; 
            padding: 25px 50px; box-shadow: 0 15px 50px rgba(0,0,0,0.1); border: 4px solid #444; cursor: pointer; text-align: left;
            position: relative;
        }
        /* 逆轉風格名字標籤 */
        .speaker-box {
            position: absolute; top: -20px; left: 30px; background: #444; color: #fff;
            padding: 5px 25px; border-radius: 5px; font-weight: 900; font-size: 1.2rem;
            box-shadow: 5px 5px 0px var(--gold);
        }
        .speech-text { font-size: 1.8rem; line-height: 1.6; color: #111; font-weight: 700; min-height: 2.4em; }

        .term { color: var(--royal-gold); border-bottom: 2px solid var(--royal-gold); cursor: help; }
        
        #wiki-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 450px; background: #fff; border-radius: 20px; padding: 35px; border: 4px solid var(--gold);
            z-index: 20000; display: none;
        }
    </style>
</head>
<body id="body-main">
    <div id="flash"></div>
    <div id="objection-bubble">不可！</div>
    <div id="app">
        <div class="speed-lines" id="speed-lines"></div>
        <div class="palace-bg"></div>
        <header class="status-bar">
            <div class="stance-container">
                <div class="stance traditionalists" id="bar-traditional" style="width: 50%;"></div>
                <div class="stance reformists" id="bar-reform" style="width: 50%;"></div>
            </div>
        </header>
        
        <main class="court-layout" id="main-stage">
            <div class="royal-row">
                <div class="character royal" id="char-king"><div class="avatar-circle"><div class="avatar-img" style="background-position: 0% 0%;"></div></div><div class="name-tag">仁祖</div></div>
                <div class="character royal" id="char-bongnim"><div class="avatar-circle"><div class="avatar-img bongnim"></div></div><div class="name-tag">鳳林大君</div></div>
                <div class="character royal" id="char-inpyeong"><div class="avatar-circle"><div class="avatar-img inpyeong"></div></div><div class="name-tag">麟坪大君</div></div>
                <div class="character royal" id="char-sesun"><div class="avatar-circle"><div class="avatar-img" style="background-position: 25% 100%;"></div></div><div class="name-tag">世孫</div></div>
            </div>

            <div class="ministers-floor">
                <div class="minister-group" id="group-b"><div class="avatars-grid" id="min-b"></div></div>
                <div class="minister-group" id="group-a"><div class="avatars-grid" id="min-a"></div></div>
                <div class="minister-group" id="group-c"><div class="avatars-grid" id="min-c"></div></div>
            </div>

            <div class="dialogue-center">
                <section class="dialogue-box" id="dialogue-box">
                    <div class="speaker-box" id="speaker">宮廷史官</div>
                    <div class="speech-text" id="speech"></div>
                </section>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="wiki-overlay" onclick="closeWiki()"></div>
    <div id="wiki-modal">
        <h2 id="wiki-title"></h2>
        <p id="wiki-content"></p>
        <button onclick="closeWiki()" style="margin-top:20px; background:var(--gold); color:#fff; border:none; padding:10px 20px; cursor:pointer;">關閉</button>
    </div>

    <script>
        const wikiData = {
            "元孫": "即昭顯世子之長子。按照『世嫡承統』原則應繼位，但仁祖欲改立鳳林大君。",
            "世孫": "即元孫。在本文中指昭顯世子之子。",
            "鳳林大君": "仁祖次子，後來的朝鮮孝宗。他在瀋陽質留多年，支持北伐。",
            "德宗": "世祖長子懿敬世子。其早逝導致世祖改立次子睿宗，是仁祖引用最重要的先例。"
        };

        const dialogue = [
            { speaker: "上", text: "予有宿疾，往往而劇，元孫如彼其微弱。予觀今日之形勢，不可以待小兒之成長。未知卿等之意以爲何如？", special: "shake" },
            { speaker: "瑬", text: "朝野方頌岡陵之祝，而殿下遽出此言，臣等罔知所達。" },
            { speaker: "上", text: "非徒疾病如此，國事日阽於艱危，脱有不諱，幼沖之主恐不能擔當大器。予欲於大君中擇立爾。", special: "speed" },
            { speaker: "瑞鳳", text: "考諸往牒，太子不在，繼以太孫，此乃不易之常經。反常行權，恐非國家之福！", special: "objection" },
            { speaker: "上", text: "雖在治平之世，必以國有長君爲福，况今日乎？" },
            { speaker: "敬輿", text: "臣之愚見，與瑞鳳無異。世嫡承統，今古之常經，常經之外更無所陳。中外人心，必皆波蕩，甚可懼也！", special: "objection" },
            { speaker: "上", text: "我世祖不傳於元孫，傳於睿宗，當時朝臣無異議，果皆不忠者耶？大臣當國家之大事，宜任其責！", special: "shake" },
            { speaker: "上", text: "此事專在於領相，卿其決之！", special: "flash" },
            { speaker: "瑬", text: "臣雖忝首相，顧安敢獨斷乎？今日之擧，未見其必係於存亡，而欲行非常之道，此臣等之所以不敢輕議也。" },
            { speaker: "上", text: "古之大臣擔當國事，不知有其身。今卿等知其可，而不肯言，何也？", special: "speed" },
            { speaker: "自點", text: "此舉出於聖上之深思慮，宜速斷定，何必持難耶？" },
            { speaker: "上", text: "大臣之議，每以經常二字為執言之地，含糊傳會。棄職而去宜矣！士君子行己處心，豈可如是黠鼠耶？", special: "shake" },
            { speaker: "上", text: "以鳳林大君為世子。", special: "flash" },
            { speaker: "自點", text: "當捧承傳乎？" },
            { speaker: "史官", text: "（左右竊笑）上曰：『無庸為也。』瑬請令禮曹奉行，上曰：『徐為之未晚也。』" }
        ];

        const ministersData = {
            "瑬": { px: '12.5%', py: '0%', group: 'a' },
            "自點": { px: '50%', py: '0%', group: 'a' },
            "瑞鳳": { px: '25%', py: '0%', group: 'b' },
            "敬輿": { px: '62.5%', py: '0%', group: 'b' },
            "景奭": { px: '75%', py: '100%', group: 'b' },
            "堉": { px: '100%', py: '0%', group: 'b' },
            "悦": { px: '37.5%', py: '0%', group: 'c' },
            "壽賢": { px: '87.5%', py: '0%', group: 'c' },
            "太和": { px: '0%', py: '100%', group: 'c' },
            "楘": { px: '100%', py: '100%', group: 'c' },
            "爾徵": { px: '25%', py: '100%', group: 'c' },
            "德泂": { px: '37.5%', py: '100%', group: 'c' },
            "仁垕": { px: '50%', py: '100%', group: 'c' },
            "時白": { px: '62.5%', py: '100%', group: 'c' },
            "植": { px: '75%', py: '0%', group: 'c' }
        };

        let currentIndex = -1;
        let isTyping = false;

        function typeText(element, text) {
            isTyping = true;
            element.innerHTML = "";
            let i = 0;
            const timer = setInterval(() => {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                } else {
                    clearInterval(timer);
                    element.innerHTML = formatText(element.innerHTML);
                    isTyping = false;
                }
            }, 50);
        }

        function triggerSpecial(type) {
            const stage = document.getElementById('main-stage');
            const flash = document.getElementById('flash');
            const speed = document.getElementById('speed-lines');
            const bubble = document.getElementById('objection-bubble');

            if (type === "shake") {
                stage.classList.add('shake-screen');
                setTimeout(() => stage.classList.remove('shake-screen'), 400);
            } else if (type === "flash") {
                flash.classList.add('flash-active');
                setTimeout(() => flash.classList.remove('flash-active'), 300);
            } else if (type === "speed") {
                speed.classList.add('active');
                setTimeout(() => speed.classList.remove('active'), 1000);
            } else if (type === "objection") {
                bubble.classList.add('show');
                flash.classList.add('flash-active');
                stage.classList.add('shake-screen');
                setTimeout(() => {
                    bubble.classList.remove('show');
                    flash.classList.remove('flash-active');
                    stage.classList.remove('shake-screen');
                }, 800);
            }
        }

        function nextDialogue() {
            if (isTyping) return;
            currentIndex++;
            if (currentIndex >= dialogue.length) return;
            const entry = dialogue[currentIndex];
            
            document.getElementById('speaker').innerText = entry.speaker;
            typeText(document.getElementById('speech'), entry.text);
            
            if (entry.special) triggerSpecial(entry.special);

            document.querySelectorAll('.character').forEach(c => c.classList.remove('active'));
            if (entry.speaker === "上") document.getElementById('char-king').classList.add('active');
            else if (ministersData[entry.speaker]) document.getElementById(`char-${entry.speaker}`).classList.add('active');
            
            if (entry.text.includes("鳳林大君")) document.getElementById('char-bongnim').classList.add('active');
            if (entry.text.includes("元孫") || entry.text.includes("世孫")) document.getElementById('char-sesun').classList.add('active');
        }

        function showWiki(term) {
            document.getElementById('wiki-title').innerText = term;
            document.getElementById('wiki-content').innerText = wikiData[term];
            document.getElementById('wiki-modal').style.display = 'block';
            document.getElementById('wiki-overlay').style.display = 'block';
        }
        function closeWiki() {
            document.getElementById('wiki-modal').style.display = 'none';
            document.getElementById('wiki-overlay').style.display = 'none';
        }
        function formatText(text) {
            let res = text;
            Object.keys(wikiData).forEach(k => {
                res = res.replace(new RegExp(k, 'g'), `<span class="term" onclick="event.stopPropagation(); showWiki('${k}')">${k}</span>`);
            });
            return res;
        }

        function init() {
            Object.keys(ministersData).forEach(name => {
                const data = ministersData[name];
                const grid = document.getElementById('min-' + data.group);
                const div = document.createElement('div');
                div.className = 'character minister avatar-container';
                div.id = `char-${name}`;
                div.innerHTML = `<div class="avatar-circle"><div class="avatar-img" style="background-position: ${data.px} ${data.py}"></div></div><div class="name-tag">${name}</div>`;
                grid.appendChild(div);
            });
            document.getElementById('dialogue-box').addEventListener('click', nextDialogue);
        }
        window.onload = init;
    </script>
</body>
</html>
