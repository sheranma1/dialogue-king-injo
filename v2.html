<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朝廷爭議 V2 - 百科全書版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --king-red: #c0392b;
            --gold: #d4af37;
            --ink-black: #0a0a0a;
            --paper-white: #f4f1ea;
            --a-color: #ffd700;
            --b-color: #2e86de;
            --c-color: #95a5a6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--ink-black); color: var(--paper-white); font-family: 'Noto Serif TC', serif; overflow: hidden; height: 100vh; }
        #app { width: 100vw; height: 100vh; display: flex; flex-direction: column; position: relative; }
        .palace-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #2c0a0a 0%, #000 100%); z-index: -2; }

        .status-bar { height: 60px; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; border-bottom: 2px solid var(--gold); padding: 0 20px; z-index: 1000; }
        .stance-container { width: 50%; height: 16px; background: #000; border: 1px solid var(--gold); display: flex; border-radius: 8px; overflow: hidden; }
        .stance { transition: width 0.8s ease; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: white; }
        .traditionalists { background: var(--b-color); }
        .reformists { background: #e74c3c; }

        .court-layout { flex: 1; display: flex; flex-direction: column; padding: 10px; position: relative; }
        .king-throne { height: 35%; display: flex; justify-content: center; align-items: center; }
        
        .ministers-floor { height: 35%; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 20px; }
        .minister-wing { display: flex; gap: 8px; position: relative; min-width: 150px; justify-content: center; padding-bottom: 10px; }
        .wing-label { position: absolute; top: -35px; width: 100%; text-align: center; font-size: 1.1rem; font-weight: 900; color: var(--gold); letter-spacing: 2px; }
        
        .character { display: flex; flex-direction: column; align-items: center; transition: all 0.4s ease; filter: grayscale(0.5) brightness(0.6); }
        .character.active { filter: grayscale(0) brightness(1.2) drop-shadow(0 0 15px var(--gold)); transform: scale(1.3) translateY(-15px); z-index: 100; }
        .silhouette { background-image: url('characters_sheet.png'); background-size: 900% 200%; background-repeat: no-repeat; image-rendering: pixelated; }
        
        /* 恢復全身像比例 */
        .king-sil { background-position: 0% 0%; width: 140px; height: 220px; }
        .min-sil { background-position: var(--pos-x, 0%) var(--pos-y, 0%); width: 110px; height: 180px; clip-path: inset(0 0 15% 0); }
        .name-tag { margin-top: 4px; font-size: 10px; background: rgba(0,0,0,0.8); border: 1px solid var(--gold); color: var(--gold); padding: 1px 4px; }

        .dialogue-center { height: 30%; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 10px; }
        .dialogue-box { width: 95%; max-width: 900px; background: rgba(5, 5, 5, 0.95); border: 2px solid var(--gold); padding: 20px 40px; border-radius: 12px; cursor: pointer; text-align: center; }
        .speaker-name { color: var(--gold); font-size: 1.6rem; font-weight: 900; margin-bottom: 8px; }
        .speech-text { font-size: 1.8rem; line-height: 1.4; color: #fff; font-weight: 500; }

        /* 人物百科詞條樣式 */
        .term { color: var(--gold); font-weight: 900; text-decoration: underline dashed; cursor: help; transition: color 0.3s; }
        .term:hover { color: #fff; background: rgba(212,175,55,0.2); }

        /* 百科彈窗 */
        #wiki-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 500px; background: #111; border: 3px solid var(--gold);
            padding: 30px; border-radius: 15px; z-index: 5000;
            display: none; box-shadow: 0 0 100px rgba(0,0,0,1);
        }
        #wiki-modal h2 { color: var(--gold); margin-bottom: 15px; border-bottom: 1px solid var(--gold); padding-bottom: 10px; }
        #wiki-modal p { line-height: 1.6; color: #ccc; font-size: 1.1rem; }
        #wiki-close { margin-top: 20px; background: var(--gold); color: #000; border: none; padding: 5px 15px; cursor: pointer; font-weight: 900; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 4999; display: none; }

        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-2px, 2px); } 100% { transform: translate(1px, -1px); } }
        .shake { animation: shake 0.2s infinite; }
    </style>
</head>
<body>
    <div id="app">
        <div class="palace-bg"></div>
        <header class="status-bar">
            <div class="stance-container">
                <div class="stance traditionalists" id="bar-traditional"><span>守經</span></div>
                <div class="stance reformists" id="bar-reform"><span>權變</span></div>
            </div>
        </header>
        <main class="court-layout">
            <div class="king-throne">
                <div class="character king" id="char-king">
                    <div class="silhouette king-sil"></div>
                    <div class="name-tag">上 (仁祖)</div>
                </div>
            </div>
            <div class="ministers-floor">
                <div class="minister-wing wing-b" id="min-b"><div class="wing-label">B組：守經主力</div></div>
                <div class="minister-wing wing-a" id="min-a"><div class="wing-label">A組：權力核心</div></div>
                <div class="minister-wing wing-c" id="min-c"><div class="wing-label">C組：其他參與者</div></div>
            </div>
            <div class="dialogue-center">
                <section class="dialogue-box" id="dialogue-box">
                    <div class="speaker-name" id="speaker">宮廷史官</div>
                    <div class="speech-text" id="speech">點擊開始這場決定宗社命運的對話。</div>
                    <div class="click-hint">點擊屏幕繼續 ▽</div>
                </section>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="wiki-overlay"></div>
    <div id="wiki-modal">
        <h2 id="wiki-title">人物名稱</h2>
        <p id="wiki-content">歷史背景信息...</p>
        <button id="wiki-close">關閉</button>
    </div>

    <script>
        const wikiData = {
            "元孫": "即昭顯世子之長子（後來的慶善君李栢）。按照「世嫡承統」的原則，世子死後應由其長子繼位。但在本次爭議中，仁祖試圖跳過元孫，改立次子鳳林大君。",
            "鳳林大君": "仁祖之次子，後來的朝鮮孝宗。在昭顯世子離奇死亡後，被仁祖選定為繼承人。他曾在瀋陽作為人質多年，回國後支持仁祖的北伐政策。",
            "領相": "指領議政，當時由金瑬擔任。是朝廷中職位最高的官員，掌握著議定儲君的關鍵影響力。",
            "睿宗": "朝鮮第七代國王世祖之次子。曾因世祖改立長君的先例被仁祖引用，作為改立鳳林大君的歷史依據。",
            "世祖": "朝鮮第七代國王，通過「癸酉靖難」篡位奪權。他在繼承人問題上曾打破常規，由次子睿宗繼承，而非長孫。",
            "昭顯世子": "仁祖的長子，長期在清朝作為人質。回國後不久離奇死亡，引發了本次嚴重的繼承人危機。",
            "德宗": "即世祖的長子，昭顯世子的追封封號。他的早逝导致了世祖朝的继承争议。",
            "月山大君": "德宗的長子，成宗的哥哥。雖然是嫡長孫，但在世祖朝因年幼被跳過，由睿宗繼位。"
        };

        const dialogue = [
            { speaker: "上", text: "予有宿疾，往往而劇，元孫如彼其微弱。予觀今日之形勢，不可以待小兒之成長。未知卿等之意以爲何如？", mood: 20, stance: 0 },
            { speaker: "瑬", text: "朝野方頌岡陵之祝，而殿下遽出此言，臣等罔知所達。", mood: 25, stance: -5 },
            { speaker: "上", text: "非徒疾病如此，國事日阽於艱危，脱有不諱，幼沖之主恐不能擔當大器。予欲於大君中擇立爾。", mood: 40, stance: 10 },
            { speaker: "瑬", text: "今此下教，雖出於爲宗社之大計，而臣等惶惑不知所言，宜博詢諸臣。", mood: 45, stance: 0 },
            { speaker: "瑞鳳", text: "考諸往牒，太子不在，繼以太孫，此乃不易之常經。反常行權，恐非國家之福。", mood: 50, stance: -15 },
            { speaker: "上", text: "雖在治平之世，必以國有長君爲福，况今日乎？", mood: 60, stance: 5 },
            { speaker: "悦", text: "瑞鳳之言，正合臣意。殿下雖有微恙，春秋鼎盛，元孫雖曰微弱，已至十歲。宗統甚重，恐不可輕議也。", mood: 60, stance: -10 },
            { speaker: "自點", text: "殿下以疾病之未平、時事之艱虞，爲宗社、生民之大計，而發此言，宜更詢于諸臣而決之。", mood: 65, stance: 0 },
            { speaker: "敬輿", text: "臣之愚見，與瑞鳳無異。世嫡承統，今古之常經，常經之外更無所陳。今者擧國之係望於元孫已久，若聞此言，則中外人心，必皆波蕩，甚可懼也。", mood: 75, stance: -20 },
            { speaker: "上", text: "我世祖不傳於元孫，傳於睿宗，當時朝臣無異議，果皆不忠者耶？大臣當國家之大事，宜任其責，而徒以循常之談，爲塞責之地，此豈大臣之道耶？", mood: 85, stance: 15 },
            { speaker: "上", text: "（謂瑬曰）此事專在於領相，卿其決之。", mood: 100, stance: 5 },
            { speaker: "瑬", text: "臣雖忝首相，顧安敢獨斷乎？今日之擧，未見其必係於存亡，而欲行非常之道，此臣等之所以不敢輕議也。", mood: 95, stance: -10 },
            { speaker: "上", text: "古之大臣擔當國事，不知有其身。今卿等知其可，而不肯言，何也？", mood: 100, stance: 15 },
            { speaker: "瑬", text: "德宗在東宮，昇遐於天順丁丑，而睿宗繼統於戊子... 光廟之建儲如此，未知何故也。", mood: 85, stance: -5 },
            { speaker: "上", text: "月山大君則性質不慧云，而當時成宗之年，亦已過十歲耶？", mood: 80, stance: 5 },
            { speaker: "瑬", text: "成宗生於丁丑德宗升遐之歲，故逮戊子世祖升遐之日，年十二矣。", mood: 80, stance: -5 },
            { speaker: "上", text: "以序言之，則當立者月山，而事有隨時變通者，故不得不如此爾。", mood: 90, stance: 15 },
            { speaker: "瑬", text: "當世祖之世，國家無事，而有此反常之擧，此蓋出於擇賢耶？", mood: 90, stance: -5 },
            { speaker: "上", text: "世祖朝事，多危疑，故必欲立長君。予亦豈不知循序之爲至順也？第惟今日之勢，必須國有長君，然後可以保宗社之重也。", mood: 100, stance: 20 },
            { speaker: "德泂", text: "臣之意，亦以瑞鳳之言爲然也。", mood: 100, stance: -5 },
            { speaker: "仁垕", text: "殿下之意，爲宗社之大計，惟在聖斷耳。", mood: 95, stance: 15 },
            { speaker: "時白", text: "洪、李二大臣之言，俱是經常之道，臣則以兩臣之意爲然也。", mood: 95, stance: -10 },
            { speaker: "景奭", text: "若一行處變之擧，而反致四方之疑惑，則雖以利害言之，亦不知其可也。", mood: 100, stance: -10 },
            { speaker: "植", text: "書生之見，只守常道，寧知權變？", mood: 100, stance: -10 },
            { speaker: "上", text: "所謂書生，平日讀書，而不知用權之道，則雖腹有詩書，亦安用哉？", mood: 100, stance: 20 },
            { speaker: "植", text: "臣恐不守經，則反不得安也。", mood: 100, stance: -5 },
            { speaker: "爾徵", text: "宗社之計，須與大臣議定，必欲問臣，但有守經而已。", mood: 100, stance: -15 },
            { speaker: "自點", text: "此舉出於聖上之深思慮，宜速斷定，何必持難耶？", mood: 90, stance: 20 },
            { speaker: "上", text: "大臣之議，每以經常二字為執言之地，含糊傳會。棄職而去宜矣！士君子行己處心，豈可如是黠鼠耶？", mood: 100, stance: 20 },
            { speaker: "悦", text: "以經常言之，則臣民之屬望，自有所載。不意今日有此非常之舉，故臣等之言如是矣。若以為宗社臣民，必如是而可安，則亦豈無行權之道乎？時任大臣及元勳皆在此，可以更詢而決之也。", mood: 90, stance: -10 },
            { speaker: "敬輿", text: "上意雖以元孫之幼沖，思得長君，而非常之舉，豈敢易議？且論其長幼，不若論其賢否。今也聖教，不及於元孫之賢否，而只以長幼為言。自古幼年嗣位，成德保邦者，亦非一二，豈可以年之幼沖，而輕易廢立耶？", mood: 80, stance: -20 },
            { speaker: "敬輿", text: "元孫之在膝下已久，其賢不肖，想已洞燭，而外庭之臣無由得知。今日臣民，皆已屬望於元孫，知有世嫡之當承而已。若反常行權，而宗社永賴，則其在古昔，亦有此事，帝王經常之典，臣亦知其不可膠守矣。", mood: 85, stance: -15 },
            { speaker: "悦", text: "今日諸臣之所以持難不決者，非過也。世子既沒，則當繼者元孫也。國本之易樹，豈可立決於一言乎？", mood: 85, stance: -10 },
            { speaker: "德泂", text: "既正元孫之名，又立輔養之官，則位號之定久矣。經常不易之典，可考信於往牒也。人臣之道，猝當反常之舉，當以守經爭之乎，抑將以處權順之乎？今日聖教，雖以宗社之計為言，而猝然一朝，欲易已正之名號，群臣若靡然從之，則將焉用彼臣為哉？", mood: 90, stance: -20 },
            { speaker: "上", text: "（默然良久曰）大臣之意，則皆歸於一耶？", mood: 70, stance: 0 },
            { speaker: "瑬", text: "似無異議也。", mood: 60, stance: 10 },
            { speaker: "上", text: "不幸諸子皆沒，只有二人，大臣擇賢而定之。此非嫡長之比，唯當擇其賢耳。", mood: 70, stance: 15 },
            { speaker: "瑞鳳", text: "大君與朝臣，無相接之事，何能知其優劣乎？古人云：『知子莫如父。』此在睿斷而已。", mood: 65, stance: 5 },
            { speaker: "上", text: "二人皆劣，無所取舍。予欲立長，未知何如？", mood: 80, stance: 20 },
            { speaker: "瑬", text: "立嫡以長，順也。", mood: 70, stance: 10 },
            { speaker: "上", text: "然。清使將來，必問國本，故不得不急急議定耳。", mood: 85, stance: 15 },
            { speaker: "瑬", text: "此外更無可議，須明白下教，使群臣明知之。", mood: 70, stance: 10 },
            { speaker: "上", text: "以鳳林大君為世子。", mood: 90, stance: 30 },
            { speaker: "自點", text: "當捧承傳乎？", mood: 40, stance: 20 },
            { speaker: "史官", text: "（左右竊笑）上曰：『無庸為也。』瑬請令禮曹奉行，上曰：『徐為之未晚也。』", mood: 50, stance: 0 },
            { speaker: "史臣曰", text: "光廟之薨，成廟之年十二歲... 瑬非不知睿宗冊封在於成宗始生之年，而佯若不知... 其逢迎之狀，不可不表而出之也。嗚呼！直道之謂君子，承順之謂鄙夫，至於逢迎，則小人而已矣。", mood: 100, stance: 0 }
        ];

        const ministersData = {
            "瑬": { px: '12.5%', py: '0%', group: 'a' },
            "自點": { px: '50%', py: '0%', group: 'a' },
            "瑞鳳": { px: '25%', py: '0%', group: 'b' },
            "敬輿": { px: '62.5%', py: '0%', group: 'b' },
            "景奭": { px: '75%', py: '100%', group: 'b' },
            "堉": { px: '100%', py: '0%', group: 'b' },
            "悦": { px: '37.5%', py: '0%', group: 'c' },
            "壽賢": { px: '87.5%', py: '0%', group: 'c' },
            "太和": { px: '0%', py: '100%', group: 'c' },
            "楘": { px: '100%', py: '100%', group: 'c' },
            "爾徵": { px: '25%', py: '100%', group: 'c' },
            "德泂": { px: '37.5%', py: '100%', group: 'c' },
            "仁垕": { px: '50%', py: '100%', group: 'c' },
            "時白": { px: '62.5%', py: '100%', group: 'c' },
            "植": { px: '75%', py: '0%', group: 'c' }
        };

        let currentIndex = -1;
        let currentStanceBalance = 50; 

        function showWiki(term) {
            if (wikiData[term]) {
                document.getElementById('wiki-title').innerText = term;
                document.getElementById('wiki-content').innerText = wikiData[term];
                document.getElementById('wiki-modal').style.display = 'block';
                document.getElementById('wiki-overlay').style.display = 'block';
            }
        }

        function closeWiki() {
            document.getElementById('wiki-modal').style.display = 'none';
            document.getElementById('wiki-overlay').style.display = 'none';
        }

        function formatText(text) {
            let formatted = text;
            Object.keys(wikiData).forEach(term => {
                const regex = new RegExp(term, 'g');
                formatted = formatted.replace(regex, `<span class="term" onclick="event.stopPropagation(); showWiki('${term}')">${term}</span>`);
            });
            return formatted;
        }

        function init() {
            Object.keys(ministersData).forEach(name => {
                const data = ministersData[name];
                const wing = document.getElementById('min-' + data.group);
                const div = document.createElement('div');
                div.className = 'character minister';
                div.id = `char-${name}`;
                div.style.setProperty('--pos-x', data.px);
                div.style.setProperty('--pos-y', data.py);
                div.innerHTML = `<div class="silhouette min-sil"></div><div class="name-tag">${name}</div>`;
                wing.appendChild(div);
            });
            document.getElementById('dialogue-box').addEventListener('click', nextDialogue);
            document.getElementById('wiki-close').addEventListener('click', closeWiki);
            document.getElementById('wiki-overlay').addEventListener('click', closeWiki);
        }

        function nextDialogue() {
            currentIndex++;
            if (currentIndex >= dialogue.length) return;
            const entry = dialogue[currentIndex];
            document.getElementById('speaker').innerText = entry.speaker;
            document.getElementById('speech').innerHTML = formatText(entry.text);
            document.querySelectorAll('.character').forEach(c => c.classList.remove('active'));
            if (entry.speaker === "上") document.getElementById('char-king').classList.add('active');
            else if (ministersData[entry.speaker]) document.getElementById(`char-${entry.speaker}`).classList.add('active');
            
            const moodFill = document.getElementById('mood-fill');
            if (moodFill) moodFill.style.width = (entry.mood || 0) + '%';
            
            currentStanceBalance += (entry.stance || 0);
            currentStanceBalance = Math.max(10, Math.min(90, currentStanceBalance));
            const barTrad = document.getElementById('bar-traditional');
            const barRef = document.getElementById('bar-reform');
            if (barTrad) barTrad.style.width = (100 - currentStanceBalance) + '%';
            if (barRef) barRef.style.width = currentStanceBalance + '%';
        }
        window.onload = init;
    </script>
</body>
</html>
