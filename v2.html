<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朝廷爭議 V2 - 逆轉裁判復刻版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #b8860b;
            --ink-black: #1a1a1a;
            --paper-white: #fcfaf2;
            --royal-red: #c0392b;
            --royal-gold: #f1c40f;
            --minister-gray: #34495e;
            --angry-red: #e74c3c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--paper-white); color: var(--ink-black); font-family: 'Noto Serif TC', serif; overflow: hidden; height: 100vh; }
        
        /* 音頻與 UI 控制 */
        .audio-controls { position: fixed; top: 15px; right: 20px; z-index: 100001; background: rgba(0,0,0,0.8); border: 2px solid var(--royal-gold); padding: 10px 20px; border-radius: 30px; display: none; align-items: center; gap: 15px; }
        #volume-slider { width: 80px; accent-color: var(--royal-gold); cursor: pointer; }

        /* 序幕與宮門 */
        #intro-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 100000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .door { position: absolute; top: 0; width: 50.5vw; height: 100vh; background: #000; transition: transform 2.2s cubic-bezier(0.645, 0.045, 0.355, 1); z-index: 1; }
        .door-left { left: 0; border-right: 3px solid var(--royal-gold); }
        .door-right { right: 0; border-left: 3px solid var(--royal-gold); }
        #intro-overlay.open .door-left { transform: translateX(-100%); }
        #intro-overlay.open .door-right { transform: translateX(100%); }
        #intro-content { position: relative; z-index: 2; text-align: center; color: #fff; max-width: 900px; }
        .intro-text { font-size: 2.1rem; font-weight: 700; line-height: 2.3; margin-bottom: 25px; opacity: 0; transform: translateY(20px); transition: 1.5s; }
        .intro-text.visible { opacity: 1; transform: translateY(0); }
        #start-btn { margin-top: 50px; padding: 20px 80px; font-size: 1.6rem; color: var(--royal-gold); border: 2px solid var(--royal-gold); background: transparent; cursor: pointer; opacity: 0; transition: 0.8s; letter-spacing: 10px; }
        #start-btn.visible { opacity: 1; }

        /* 主界面 */
        #app { width: 100vw; height: 100vh; display: flex; flex-direction: column; position: relative; transform: scale(1.1); filter: blur(5px); transition: 2.5s; opacity: 0; }
        #app.visible { transform: scale(1); filter: blur(0); opacity: 1; }
        
        .status-bar { height: 50px; background: rgba(255,255,255,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; border-bottom: 1px solid #ddd; z-index: 1000; }
        .stance-container { width: 40%; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; display: flex; }
        .stance { transition: 1s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .traditionalists { background: #2980b9; }
        .reformists { background: #c0392b; }

        .court-layout { flex: 1; display: flex; flex-direction: column; padding: 10px 40px; gap: 15px; justify-content: space-between; }
        
        .badge-circle { 
            width: 85px; height: 85px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            background: var(--minister-gray); color: #fff; font-size: 1.6rem; font-weight: 900;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: all 0.4s; border: 3px solid #fff; cursor: help;
        }
        .royal .badge-circle { width: 110px; height: 110px; background: var(--royal-red); border-color: var(--royal-gold); font-size: 2rem; }
        
        /* 發言高亮 */
        .character.active .badge-circle { transform: scale(1.4); box-shadow: 0 0 40px var(--royal-gold); border-color: var(--royal-gold); z-index: 100; animation: speaker-bounce 2s infinite ease-in-out; }
        #char-仁祖.active .badge-circle { transform: scale(1.5); box-shadow: 0 0 60px var(--royal-red); animation: royal-bounce 2s infinite ease-in-out; }
        @keyframes speaker-bounce { 0%, 100% { transform: scale(1.4) translateY(0); } 50% { transform: scale(1.45) translateY(-5px); } }
        @keyframes royal-bounce { 0%, 100% { transform: scale(1.5) translateY(0); } 50% { transform: scale(1.55) translateY(-8px); } }

        /* 分Part排版 */
        .royal-row { display: flex; justify-content: center; align-items: center; gap: 50px; height: 150px; }
        .ministers-floor { display: flex; justify-content: space-between; flex: 1; align-items: flex-start; padding: 0 20px; }
        .minister-group { display: flex; flex-direction: column; align-items: center; gap: 15px; flex: 1; }
        .avatars-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .group-label { font-weight: 900; color: #aaa; font-size: 0.8rem; letter-spacing: 2px; margin-bottom: 10px; }

        /* 文本框 */
        .dialogue-center { width: 100%; height: 280px; display: flex; flex-direction: column; align-items: center; padding: 0 20px 20px 20px; gap: 15px; margin-top: -20px; }
        .dialogue-box { width: 100%; max-width: 950px; background: #fff; border-radius: 15px; padding: 30px 60px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 5px solid #333; cursor: pointer; text-align: left; position: relative; }
        .speaker-box { position: absolute; top: -25px; left: 40px; background: #333; color: #fff; padding: 8px 35px; border-radius: 5px; font-weight: 900; font-size: 1.4rem; box-shadow: 6px 6px 0px var(--gold); }
        .speech-text { font-size: 2rem; line-height: 1.6; color: #000; font-weight: 700; min-height: 2.2em; }
        .controls { display: flex; gap: 20px; width: 100%; max-width: 950px; justify-content: flex-end; }
        .btn-control { background: #333; color: #fff; border: none; padding: 10px 30px; border-radius: 8px; font-weight: 900; cursor: pointer; box-shadow: 4px 4px 0px var(--gold); }

        /* 逆轉裁判「不可！」究極特效 */
        #objection-bubble {
            position: fixed; top: 40%; left: 50%; 
            width: 600px; height: 350px;
            transform: translate(-50%, -50%) scale(0);
            background: #c0392b; 
            color: #fff;
            display: flex; justify-content: center; align-items: center;
            font-size: 9rem; font-weight: 900; z-index: 200000;
            pointer-events: none;
            /* 鋸齒狀對話框 */
            clip-path: polygon(
                0% 15%, 10% 10%, 20% 15%, 30% 5%, 40% 15%, 50% 0%, 
                60% 15%, 70% 5%, 80% 15%, 90% 10%, 100% 15%, 
                95% 30%, 100% 50%, 95% 70%, 100% 85%, 
                90% 90%, 80% 85%, 70% 95%, 60% 85%, 50% 100%, 
                40% 85%, 30% 95%, 20% 85%, 10% 90%, 0% 85%, 
                5% 70%, 0% 50%, 5% 30%
            );
            border: 15px solid #fff;
            box-shadow: 0 0 0 10px #c0392b;
            text-shadow: 8px 8px 0px rgba(0,0,0,0.5);
        }
        #objection-bubble.show { animation: objection-impact 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes objection-impact {
            0% { transform: translate(-50%, -50%) scale(0) rotate(20deg); opacity: 1; }
            30% { transform: translate(-50%, -50%) scale(1.6) rotate(-10deg); opacity: 1; }
            45% { transform: translate(-50%, -50%) scale(1.4) rotate(5deg); }
            100% { transform: translate(-50%, -50%) scale(1.5) rotate(-5deg); opacity: 1; }
        }

        /* 放射狀速度線 */
        .action-lines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.3) 100%);
            background-image: repeating-conic-gradient(from 0deg, transparent 0deg 1deg, rgba(0,0,0,0.4) 1deg 2deg);
            z-index: 199999; opacity: 0; pointer-events: none;
        }
        .action-lines.active { animation: action-flash 0.8s steps(2); }
        @keyframes action-flash { 0%, 100% { opacity: 0; } 10%, 90% { opacity: 1; } }

        .speed-lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0; transition: 0.2s; pointer-events: none; }
        .speed-lines.active { opacity: 1; background: repeating-conic-gradient(from 0deg, transparent 0deg 1deg, rgba(0,0,0,0.08) 1deg 2deg); }
        #flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9999; opacity: 0; pointer-events: none; }
        .flash-active { animation: flash-anim 0.3s forwards; }
        @keyframes flash-anim { 0% { opacity: 1; } 100% { opacity: 0; } }
        .shake-screen { animation: screen-shake 0.4s ease-in-out; }
        @keyframes screen-shake { 0%, 100% { transform: translate(0,0); } 10%, 50%, 90% { transform: translate(-10px,-10px); } 30%, 70% { transform: translate(10px,10px); } }
        
        .term { color: var(--gold); border-bottom: 2px solid var(--gold); cursor: help; font-weight: 900; }
        #wiki-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 480px; background: #fff; border-radius: 20px; padding: 40px; border: 5px solid var(--gold); z-index: 200001; display: none; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200000; display: none; }
    </style>
</head>
<body>
    <audio id="bgm" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-17.mp3" type="audio/mpeg"></audio>
    <audio id="sfx-slam"><source src="https://assets.mixkit.co/sfx/preview/mixkit-table-slam-sound-2507.mp3" type="audio/mpeg"></audio>
    <audio id="sfx-sting"><source src="https://assets.mixkit.co/sfx/preview/mixkit-suspense-mystery-bass-hit-600.mp3" type="audio/mpeg"></audio>
    <audio id="sfx-objection"><source src="https://assets.mixkit.co/sfx/preview/mixkit-epic-impact-613.mp3" type="audio/mpeg"></audio>
    <audio id="sfx-type" loop><source src="https://assets.mixkit.co/sfx/preview/mixkit-keyboard-typing-616.mp3" type="audio/mpeg"></audio>

    <div class="action-lines" id="action-lines"></div>
    <div id="objection-bubble">不可！</div>

    <div class="audio-controls" id="audio-ui">
        <button id="audio-toggle" onclick="toggleAudio()">🔈 音效 ON</button>
        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5" oninput="adjustVolume(this.value)">
    </div>

    <div id="intro-overlay">
        <div class="door door-left"></div><div class="door door-right"></div>
        <div id="intro-content">
            <p class="intro-text" id="t1">朝鮮仁祖二十三年（1645年）</p>
            <p class="intro-text" id="t2">歸國不久的昭顯世子暴斃宮中</p>
            <p class="intro-text" id="t3">宗法與權力的齒輪開始瘋狂轉向</p>
            <p class="intro-text" id="t4">是遵循「世嫡承統」之常經？</p>
            <p class="intro-text" id="t5">還是行使「國有長君」之權變？</p>
            <p class="intro-text" id="t6" style="color:var(--royal-gold)">歷史的轉折，全在於此。</p>
            <button id="start-btn" onclick="openPalaceGates()">推門旁聽辯論</button>
        </div>
    </div>

    <div id="flash"></div>
    <div id="app">
        <div class="speed-lines" id="speed-lines"></div>
        <header class="status-bar">
            <div class="stance-container"><div class="stance traditionalists" id="bar-traditional" style="width: 50%;"></div><div class="stance reformists" id="bar-reform" style="width: 50%;"></div></div>
        </header>
        <main class="court-layout" id="main-stage">
            <div class="royal-row">
                <div class="character royal" id="char-仁祖" onclick="showWiki('仁祖')"><div class="badge-circle">仁祖</div></div>
                <div class="character royal" id="char-鳳林" onclick="showWiki('鳳林')"><div class="badge-circle">鳳林</div></div>
                <div class="character royal" id="char-麟坪" onclick="showWiki('麟坪')"><div class="badge-circle">麟坪</div></div>
                <div class="character royal" id="char-世孫" onclick="showWiki('世孫')"><div class="badge-circle">世孫</div></div>
            </div>
            
            <div class="ministers-floor">
                <div class="minister-group"><div class="group-label">守經派 (Traditionalist)</div><div class="avatars-grid" id="min-b"></div></div>
                <div class="minister-group"><div class="group-label">中立/權臣 (Opportunist)</div><div class="avatars-grid" id="min-a"></div></div>
                <div class="minister-group"><div class="group-label">擇立派 (Reformist)</div><div class="avatars-grid" id="min-c"></div></div>
            </div>

            <div class="dialogue-center">
                <section class="dialogue-box" id="dialogue-box">
                    <div class="speaker-box" id="speaker">宮廷史官</div>
                    <div class="speech-text" id="speech">...</div>
                </section>
                <div class="controls">
                    <button class="btn-control" id="btn-prev" disabled>◀ Back</button>
                    <button class="btn-control" id="btn-next">Next ▶</button>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="wiki-overlay" onclick="closeWiki()"></div>
    <div id="wiki-modal"><h2 id="wiki-title"></h2><p id="wiki-content"></p><button class="btn-control" style="width:100%; margin-top:20px;" onclick="closeWiki()">返回</button></div>

    <script>
        const wikiData = { "仁祖": "朝鮮第16代君主...", "元孫": "昭顯世子長子...", "世孫": "即元孫...", "鳳林": "仁祖次子...", "金瑬": "領議政...", "金自點": "權臣...", "洪瑞鳳": "左議政...", "德宗": "世祖長子..." };
        const dialogue = [
            { speaker: "上", text: "予有宿疾，往往而劇，元孫如彼其微弱. 予觀今日之形勢，不可以待小兒之成長. 未知卿等之意以爲何如？", special: "shake", stance: 5 },
            { speaker: "瑬", text: "朝野方頌岡陵之祝，而殿下遽出此言，臣等罔知所達。", stance: -2 },
            { speaker: "上", text: "非徒疾病如此，國事日阽於艱危，脱有不諱，幼沖之主恐不能擔當大器. 予欲於大君中擇立爾。", special: "speed", stance: 8 },
            { speaker: "瑬", text: "今此下教，雖出於爲宗社之大計，而臣等惶惑不知所言，宜博詢諸臣。", stance: -2 },
            { speaker: "瑞鳳", text: "考諸往牒，太子不在，繼以太孫，此乃不易之常經. 反常行權，恐非國家之福。", special: "objection", stance: -10 },
            { speaker: "上", text: "雖在治平之世，必以國有長君爲福，況今日乎？", stance: 5 },
            { speaker: "悦", text: "瑞鳳之言，正合臣意. 殿下雖有微恙，春秋鼎盛，元孫雖曰微弱，已至十歲. 自古幼主之繼緒者何限？宗統甚重，恐不可輕議也。", stance: -6 },
            { speaker: "自點", text: "殿下以疾病之未平、時事之艱虞，爲宗社、生民之大計，而發此言，宜更詢于諸臣而決之。", stance: 3 },
            { speaker: "敬輿", text: "臣之愚見，與瑞鳳無異. 世嫡承統，今古之常經，常經之外更無所陳. 大抵能守常經，則雖屬艱虞，而猶可以保國. 若邊用權道，則群情不服而多致患難. 今者擧國之係望於元孫已久，若聞此言，則中外人心，必皆波蕩，甚可懼也。", special: "objection", stance: -12 },
            { speaker: "上", text: "我世祖不傳於元孫，傳於睿宗，當時朝臣無異議，果皆不忠者耶？大臣當國家之大事，宜任其責，而徒以循常之談，為塞責之地，此豈大臣之道耶？", special: "shake", stance: 10 },
            { speaker: "上", text: "（謂瑬曰）此事專在於領相，卿其決之。", special: "flash", stance: 10 },
            { speaker: "瑬", text: "臣雖忝首相，顧安敢獨斷乎？若明知宗社存亡決於此舉，則群臣固無敢異議者，而今日之舉，未見其必係於存亡，而欲行非常之道，此臣等之所以不敢輕議也。", stance: -5 },
            { speaker: "上", text: "古之大臣擔當國事，不知有其身. 我太宗朝讓寧大君之在東宮也，百官請廢之，至於庭請，是皆以國為重，而不顧後患者也. 若使太宗不許，則後日之禍有不可測，而猶且為之. 今卿等知其可，而不肯言，何也？", special: "speed", stance: 8 },
            { speaker: "瑬", text: "德宗在東宮，昇遐於天順丁丑，而睿宗繼統於戊子，則當時成宗年十二歲矣，月山大君又加長矣，而光廟之建儲如此，未知何故也。", stance: -5 },
            { speaker: "上", text: "月山大君則性質不慧云，而當時成宗之年，亦已過十歲耶？", stance: 3 },
            { speaker: "瑬", text: "成宗生於丁丑德宗升遐之歲，故逮戊子世祖升遐之日，年十二矣。", stance: -2 },
            { speaker: "上", text: "以序言之，則當立者月山，而事有隨時變通者，故不得不如此爾. 若以為常經不可不守，則世祖何以不傳於月山，而傳於睿宗，若以長幼言之，則睿宗何以舍月山，而立成廟耶？", special: "shake", stance: 12 },
            { speaker: "瑬", text: "當世祖之世，國家無事，而有此反常之擧，大聖人處事，誠未可量，此蓋出於擇賢耶？", stance: -3 },
            { speaker: "上", text: "世祖朝事，多危疑，故必欲立長君. 若出於擇賢，則成廟之聖，豈必不及於睿宗耶？予亦豈不知循序，而傳之之為至順也？第惟今日之勢，必須國有長君，然後可以保宗社之重也.", special: "speed", stance: 10 },
            { speaker: "德泂", text: "臣之意，亦以瑞鳳之言為然也。", stance: -5 },
            { speaker: "仁垕", text: "殿下之意，為宗社之大計，惟在聖斷耳。", stance: 5 },
            { speaker: "時白", text: "洪、李二大臣之言，俱是經常之道，臣則以兩臣之意為然也。", stance: -5 },
            { speaker: "景奭", text: "國有長君，雖曰社稷之福，無易樹之，乃是先王之典. 且國家安危之機，若能如燭照龜卜，則聖慮所在，不為無見，而若一行處變之舉，而反致四方之疑惑，則雖以利害言之，亦不知其可也。", special: "objection", stance: -10 },
            { speaker: "植", text: "書生之見，只守常道，寧知權變？", stance: -5 },
            { speaker: "上", text: "所謂書生，平日讀書，而不知用權之道，則雖腹有詩書，亦安用哉？且今日定策，豈如權謀術數之難知者耶？", special: "shake", stance: 8 },
            { speaker: "植", text: "守經而宗社必危，行權而國家可安，則此舉未為不可，而臣恐不守經，則反不得安也。", stance: -5 },
            { speaker: "壽賢", text: "國家重事，不可以一二人之見決之，須熟講於大臣而為之。", stance: -3 },
            { speaker: "堉", text: "世祖朝國家寧謐，故能行反常之舉，今日形勢異於當時，恐不可輕易行之也。", stance: -6 },
            { speaker: "太和", text: "臣之意與堉同矣。", stance: -4 },
            { speaker: "上", text: "兩司長官亦各言其意。", stance: 0 },
            { speaker: "楘", text: "三代以後，承統有序，若邊行權道，則必有大患矣。", special: "objection", stance: -8 },
            { speaker: "爾徵", text: "宗社之計，須與大臣議定，必欲問臣，但有守經而已。", stance: -10 },
            { speaker: "上", text: "（厲聲曰）此事必須與大臣決之. 卿等但為此常談，一朝若不諱，卿等何以為計耶？", special: "shake", stance: 15 },
            { speaker: "自點", text: "此舉出於聖上之深思慮，宜速斷定，何必持難耶？", stance: 10 },
            { speaker: "上", text: "大臣之議，每以經常二字為執言之地，含糊傳會. 棄職而去宜矣！士君子行己處心，豈可如是黠鼠耶？", special: "shake", stance: 12 },
            { speaker: "悦", text: "以經常言之，則臣民之屬望，自有所載. 不意今日有此非常之舉，故臣等之言如是矣. 若以為宗社臣民，必如是而可安，則亦豈無行權之道乎？", stance: -5 },
            { speaker: "敬輿", text: "上意雖以元孫之幼沖，思得長君，而非常之舉，豈敢易議？且論其長幼，不若論其賢否. 今也聖教，不及於元孫之賢否，而只以長幼為言. 自古幼年嗣位，成德保邦者，亦非一二，豈可以年之幼沖，而輕易廢立耶？", stance: -10 },
            { speaker: "敬輿", text: "元孫之在膝下已久，其賢不肖，想已洞燭，而外庭之臣無由得知. 今日臣民，皆已屬望於元孫，知有世嫡之當承而已. 若反常行權，而宗社永賴，則其在古昔，亦有此事，帝王經常之典，臣亦知其不可膠守矣。", special: "objection", stance: -8 },
            { speaker: "悦", text: "今日諸臣之所以持難不決者，非過也. 世子既沒，則當繼者元孫也. 國本之易樹，豈可立決於一言乎？", stance: -6 },
            { speaker: "德泂", text: "既正元孫之名，又立輔養之官，則位號之定久矣. 經常不易之典，可考信於往牒也. 人臣之道，猝當反常之舉，當以守經爭之乎，抑將以處權順之乎？今日聖教，雖以宗社之計為言，而猝然一朝，欲易已正之名號，群臣若靡然從之，則將焉用彼臣為哉？", special: "objection", stance: -12 },
            { speaker: "上", text: "（默然良久曰）大臣之意，則皆歸於一耶？", special: "flash", stance: 5 },
            { speaker: "瑬", text: "似無異議也。", stance: 10 },
            { speaker: "上", text: "不幸諸子皆沒，只有二人，大臣擇賢而定之. 此非嫡長之比，唯當擇其賢耳。", stance: 8 },
            { speaker: "瑞鳳", text: "大君與朝臣，無相接之事，何能知其優劣乎？古人云：『知子莫如父. 』此在睿斷而已。", stance: 5 },
            { speaker: "上", text: "二人皆劣，無所取舍. 予欲立長，未知何如？", stance: 12 },
            { speaker: "瑬", text: "立嫡以長，順也。", stance: 10 },
            { speaker: "上", text: "然. 清使將來，必問國本，故不得不急急議定耳.", special: "speed", stance: 10 },
            { speaker: "瑬", text: "此外更無可議，須明白下教，使群臣明知之。", stance: 5 },
            { speaker: "上", text: "以鳳林大君為世子。", special: "flash", stance: 20 },
            { speaker: "自點", text: "當捧承傳乎？", stance: 5 },
            { speaker: "史官", text: "（左右竊笑）上曰：『無庸為也。』瑬請令禮曹奉行，上曰：『徐為之未晚也。』", stance: 0 }
        ];

        const ministersData = { "瑬": "a", "自點": "a", "瑞鳳": "b", "敬輿": "b", "景奭": "b", "堉": "b", "悦": "c", "壽賢": "c", "太和": "c", "楘": "c", "爾徵": "c", "德泂": "c", "仁垕": "c", "時白": "c", "植": "c" };

        function openPalaceGates() {
            document.getElementById('intro-overlay').classList.add('open');
            document.getElementById('bgm').play();
            document.getElementById('audio-ui').style.display = 'flex';
            setTimeout(() => document.getElementById('app').classList.add('visible'), 500);
            setTimeout(() => document.getElementById('intro-overlay').style.display = 'none', 3500);
        }

        function adjustVolume(v) { document.getElementById('bgm').volume = v; document.getElementById('sfx-slam').volume = v; document.getElementById('sfx-sting').volume = v; document.getElementById('sfx-objection').volume = v; document.getElementById('sfx-type').volume = v*0.2; }
        function toggleAudio() { const b = document.getElementById('bgm'); if(b.paused){b.play(); document.getElementById('audio-toggle').innerText="🔈 音效 ON";}else{b.pause(); document.getElementById('audio-toggle').innerText="🔇 靜音";} }

        let currentIndex = -1, isTyping = false, typingTimer = null, currentStanceBalance = 50;
        function updateUI() {
            const entry = dialogue[currentIndex];
            document.getElementById('speaker').innerText = entry.speaker;
            if (typingTimer) clearInterval(typingTimer);
            isTyping = true; document.getElementById('sfx-type').play();
            let i = 0; document.getElementById('speech').innerHTML = "";
            typingTimer = setInterval(() => {
                if (i < entry.text.length) { document.getElementById('speech').innerHTML += entry.text.charAt(i); i++; }
                else { clearInterval(typingTimer); document.getElementById('sfx-type').pause(); document.getElementById('speech').innerHTML = formatText(document.getElementById('speech').innerHTML); isTyping = false; }
            }, 30);

            if (entry.special === "objection") { 
                document.getElementById('sfx-objection').play(); 
                document.getElementById('action-lines').classList.add('active');
                document.getElementById('objection-bubble').classList.add('show');
                setTimeout(() => {
                    document.getElementById('objection-bubble').classList.remove('show');
                    document.getElementById('action-lines').classList.remove('active');
                }, 800);
                triggerSpecial("shake"); triggerSpecial("flash");
            }
            if (entry.special === "shake" || entry.stance >= 12) { document.getElementById('sfx-slam').play(); triggerSpecial("shake"); }
            if (entry.special === "flash" || entry.stance <= -10) { document.getElementById('sfx-sting').play(); triggerSpecial("flash"); }
            if (entry.special === "speed") triggerSpecial("speed");

            currentStanceBalance += (entry.stance || 0);
            document.getElementById('bar-traditional').style.width = (100 - Math.max(10, Math.min(90, currentStanceBalance))) + '%';
            document.getElementById('bar-reform').style.width = Math.max(10, Math.min(90, currentStanceBalance)) + '%';
            
            document.querySelectorAll('.character').forEach(c => c.classList.remove('active'));
            let tid = (entry.speaker === "上") ? 'char-仁祖' : `char-${entry.speaker}`;
            if (document.getElementById(tid)) document.getElementById(tid).classList.add('active');
        }

        function triggerSpecial(type) {
            const stage = document.getElementById('main-stage'), flash = document.getElementById('flash'), speed = document.getElementById('speed-lines');
            if (type === "shake") { stage.classList.add('shake-screen'); setTimeout(() => stage.classList.remove('shake-screen'), 400); }
            else if (type === "flash") { flash.classList.add('flash-active'); setTimeout(() => flash.classList.remove('flash-active'), 300); }
            else if (type === "speed") { speed.classList.add('active'); setTimeout(() => speed.classList.remove('active'), 1200); }
        }

        function formatText(text) { let res = text; Object.keys(wikiData).forEach(k => { res = res.replace(new RegExp(k, 'g'), `<span class="term" onclick="event.stopPropagation(); showWiki('${k}')">${k}</span>`); }); return res; }
        function showWiki(t) { document.getElementById('wiki-title').innerText = t; document.getElementById('wiki-content').innerText = wikiData[t] || "..."; document.getElementById('wiki-modal').style.display='block'; document.getElementById('wiki-overlay').style.display='block'; }
        function closeWiki() { document.getElementById('wiki-modal').style.display='none'; document.getElementById('wiki-overlay').style.display='none'; }

        function init() {
            Object.keys(ministersData).forEach(n => {
                const group = ministersData[n];
                const d = document.createElement('div'); d.className = 'character minister'; d.id = `char-${n}`; d.onclick = () => showWiki(n);
                d.innerHTML = `<div class="badge-circle">${n}</div>`;
                document.getElementById('min-' + group).appendChild(d);
            });
            document.getElementById('dialogue-box').onclick = () => { if(isTyping){clearInterval(typingTimer); document.getElementById('sfx-type').pause(); document.getElementById('speech').innerHTML = formatText(dialogue[currentIndex].text); isTyping=false;} else if(currentIndex < dialogue.length-1){currentIndex++; updateUI();} };
            document.getElementById('btn-next').onclick = document.getElementById('dialogue-box').onclick;
            document.getElementById('btn-prev').onclick = (e) => { e.stopPropagation(); if (currentIndex > 0) { currentIndex--; currentStanceBalance = 50; for(let i=0; i<=currentIndex; i++) currentStanceBalance += (dialogue[i].stance || 0); updateUI(); } };
            window.onkeydown = (e) => { if(e.code==="Space") { e.preventDefault(); document.getElementById('dialogue-box').click(); } else if(e.code==="ArrowLeft" || e.code==="Backspace") { document.getElementById('btn-prev').click(); } };
            
            const texts = document.querySelectorAll('.intro-text');
            texts.forEach((t, i) => setTimeout(() => t.classList.add('visible'), i * 1400 + 500));
            setTimeout(() => document.getElementById('start-btn').classList.add('visible'), 1400 * 6 + 1000);
        }
        window.onload = init;
    </script>
</body>
</html>
