<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朝廷爭議 V2 - 像素精修版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #b8860b;
            --ink-black: #1a1a1a;
            --paper-white: #fcfaf2;
            --royal-gold: #f39c12;
            --angry-red: #ff3f34;
            --blue-trad: #3498db;
            --red-reform: #e74c3c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--paper-white); color: var(--ink-black); font-family: 'Noto Serif TC', serif; overflow: hidden; height: 100vh; }
        #app { width: 100vw; height: 100vh; display: flex; flex-direction: column; position: relative; }
        
        /* 視覺效果層 */
        .speed-lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.8) 100%), repeating-conic-gradient(from 0deg, transparent 0deg 1deg, rgba(255,255,255,0.1) 1deg 2deg); z-index: -1; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        .speed-lines.active { opacity: 1; }
        .palace-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #fff 0%, #fcfaf2 100%); z-index: -2; }

        #objection-bubble { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); font-size: 15rem; font-weight: 900; color: var(--angry-red); text-shadow: 10px 10px 0px #fff, -5px -5px 0px #fff, 0 0 50px rgba(255,0,0,0.5); z-index: 10000; pointer-events: none; transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275); font-style: italic; }
        #objection-bubble.show { transform: translate(-50%, -50%) scale(1); }

        #flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9999; opacity: 0; pointer-events: none; }
        .flash-active { animation: flash-anim 0.3s forwards; }
        @keyframes flash-anim { 0% { opacity: 1; } 100% { opacity: 0; } }

        @keyframes screen-shake { 0%, 100% { transform: translate(0,0); } 10%, 30%, 50%, 70%, 90% { transform: translate(-8px,-8px); } 20%, 40%, 60%, 80% { transform: translate(8px,8px); } }
        .shake-screen { animation: screen-shake 0.4s ease-in-out; }

        /* 頂部狀態欄 */
        .status-bar { height: 60px; background: rgba(255,255,255,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; border-bottom: 2px solid #ddd; z-index: 1000; gap: 5px; }
        .bar-labels { display: flex; justify-content: space-between; width: 50%; font-weight: 900; font-size: 0.9rem; color: #666; }
        .stance-container { width: 50%; height: 12px; background: #eee; border-radius: 6px; overflow: hidden; display: flex; border: 1px solid #ccc; }
        .stance { transition: width 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .traditionalists { background: var(--blue-trad); }
        .reformists { background: var(--red-reform); }

        .court-layout { flex: 1; display: flex; flex-direction: column; padding: 10px; gap: 15px; }
        
        /* 皇室：145px */
        .royal-row { display: flex; justify-content: center; align-items: center; gap: 45px; height: 180px; }
        .avatar-container { display: flex; flex-direction: column; align-items: center; gap: 10px; transition: all 0.2s; }
        .avatar-circle { width: 110px; height: 110px; border-radius: 50%; background: #fff; border: 4px solid #ccc; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; }
        .royal .avatar-circle { width: 145px; height: 145px; border-width: 6px; border-color: var(--royal-gold); }
        .character.active .avatar-circle { transform: scale(1.1); border-color: var(--royal-gold); box-shadow: 0 0 30px rgba(243,156,18,0.5); }
        
        /* 核心修復：使用 900% 600% 保持原始 1.5 比例，徹底消除大餅臉 */
        .avatar-img { 
            width: 100%; height: 100%; 
            background-image: url('characters_sheet.png'); 
            background-size: 900% 600%; /* 修復比例：不再橫向拉伸 */
            transform: scale(2.6) translateY(12%); /* 默認縮放中心調整 */
            image-rendering: auto;
        }

        /* 鳳林大君與麟坪大君：獨立處理 */
        .avatar-img.standalone {
            background-size: cover;
            background-position: center 20%;
            transform: scale(1.1);
        }

        .name-tag { font-size: 16px; font-weight: 900; background: #eee; padding: 3px 15px; border-radius: 12px; border: 1px solid #ddd; color: #333; }

        /* 大臣：110px */
        .ministers-floor { display: flex; justify-content: space-around; flex: 1; align-items: flex-start; }
        .minister-group { display: flex; flex-direction: column; align-items: center; gap: 10px; flex: 1; }
        .avatars-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }

        /* 對話框區域 */
        .dialogue-center { height: 260px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; padding: 0 20px 40px 20px; gap: 15px; }
        .dialogue-box { width: 100%; max-width: 900px; background: rgba(255,255,255,0.98); border-radius: 15px; padding: 25px 50px; box-shadow: 0 15px 50px rgba(0,0,0,0.12); border: 4px solid #333; cursor: pointer; text-align: left; position: relative; }
        .speaker-box { position: absolute; top: -20px; left: 30px; background: #333; color: #fff; padding: 5px 25px; border-radius: 5px; font-weight: 900; font-size: 1.25rem; box-shadow: 5px 5px 0px var(--gold); }
        .speech-text { font-size: 1.85rem; line-height: 1.6; color: #000; font-weight: 700; min-height: 2.4em; }

        .controls { display: flex; gap: 20px; width: 100%; max-width: 900px; justify-content: flex-end; }
        .btn-control { background: #333; color: #fff; border: none; padding: 8px 25px; border-radius: 8px; font-weight: 900; cursor: pointer; box-shadow: 4px 4px 0px var(--gold); transition: transform 0.1s; font-size: 0.9rem; }
        .btn-control:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--gold); }

        .term { color: var(--royal-gold); border-bottom: 2px solid var(--royal-gold); cursor: help; }
        #wiki-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 450px; background: #fff; border-radius: 20px; padding: 35px; border: 4px solid var(--gold); z-index: 20000; display: none; }
    </style>
</head>
<body id="body-main">
    <div id="flash"></div>
    <div id="objection-bubble">不可！</div>
    <div id="app">
        <div class="speed-lines" id="speed-lines"></div>
        <div class="palace-bg"></div>
        <header class="status-bar">
            <div class="bar-labels"><span>守經 (Grandson)</span><span>擇立 (Bongnim)</span></div>
            <div class="stance-container">
                <div class="stance traditionalists" id="bar-traditional" style="width: 50%;"></div>
                <div class="stance reformists" id="bar-reform" style="width: 50%;"></div>
            </div>
        </header>
        
        <main class="court-layout" id="main-stage">
            <div class="royal-row">
                <div class="character royal" id="char-king"><div class="avatar-circle"><div class="avatar-img" style="background-position: 0% 0%;"></div></div><div class="name-tag">仁祖</div></div>
                <div class="character royal" id="char-bongnim"><div class="avatar-circle"><div class="avatar-img standalone" style="background-image: url('bongnim.png');"></div></div><div class="name-tag">鳳林大君</div></div>
                <div class="character royal" id="char-inpyeong"><div class="avatar-circle"><div class="avatar-img standalone" style="background-image: url('inpyeong.png');"></div></div><div class="name-tag">麟坪大君</div></div>
                <div class="character royal" id="char-sesun"><div class="avatar-circle"><div class="avatar-img" style="background-position: 25% 100%;"></div></div><div class="name-tag">世孫</div></div>
            </div>

            <div class="ministers-floor">
                <div class="minister-group" id="group-b"><div class="avatars-grid" id="min-b"></div></div>
                <div class="minister-group" id="group-a"><div class="avatars-grid" id="min-a"></div></div>
                <div class="minister-group" id="group-c"><div class="avatars-grid" id="min-c"></div></div>
            </div>

            <div class="dialogue-center">
                <section class="dialogue-box" id="dialogue-box">
                    <div class="speaker-box" id="speaker">宮廷史官</div>
                    <div class="speech-text" id="speech">點擊屏幕或按空格鍵開始。</div>
                </section>
                <div class="controls">
                    <button class="btn-control" id="btn-prev" disabled>◀ 回退 (Back)</button>
                    <button class="btn-control" id="btn-next">前進 (Space) ▶</button>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="wiki-overlay" onclick="closeWiki()"></div>
    <div id="wiki-modal">
        <h2 id="wiki-title"></h2>
        <p id="wiki-content"></p>
        <button onclick="closeWiki()" style="margin-top:20px; background:var(--gold); color:#fff; border:none; padding:10px 20px; cursor:pointer;">關閉</button>
    </div>

    <script>
        const wikiData = {
            "元孫": "即昭顯世子之長子。按照『世嫡承統』原則應繼位，但仁祖欲改立鳳林大君。",
            "世孫": "即元孫。在本文中指昭顯世子之子。",
            "鳳林大君": "仁祖次子，後來的朝鮮孝宗。他在瀋陽質留多年，支持北伐。",
            "德宗": "世祖長子懿敬世子。其早逝導致世祖改立次子睿宗，是仁祖引用最重要的先例。"
        };

        const dialogue = [
            { speaker: "上", text: "予有宿疾，往往而劇，元孫如彼其微弱。予觀今日之形勢，不可以待小兒之成長。未知卿等之意以爲何如？", special: "shake", stance: 5 },
            { speaker: "瑬", text: "朝野方頌岡陵之祝，而殿下遽出此言，臣等罔知所達。", stance: -2 },
            { speaker: "上", text: "非徒疾病如此，國事日阽於艱危，脱有不諱，幼沖之主恐不能擔當大器。予欲於大君中擇立爾。", special: "speed", stance: 8 },
            { speaker: "瑬", text: "今此下教，雖出於爲宗社之大計，而臣等惶惑不知所言，宜博詢諸臣。", stance: -2 },
            { speaker: "瑞鳳", text: "考諸往牒，太子不在，繼以太孫，此乃不易之常經。反常行權，恐非國家之福。", special: "objection", stance: -10 },
            { speaker: "上", text: "雖在治平之世，必以國有長君爲福，況今日乎？", stance: 5 },
            { speaker: "悦", text: "瑞鳳之言，正合臣意。殿下雖有微恙，春秋鼎盛，元孫雖曰微弱，已至十歲。自古幼主之繼緒者何限？宗統甚重，恐不可輕議也。", stance: -6 },
            { speaker: "自點", text: "殿下以疾病之未平、時事之艱虞，爲宗社、生民之大計，而發此言，宜更詢于諸臣而決之。", stance: 3 },
            { speaker: "敬輿", text: "臣之愚見，與瑞鳳無異。世嫡承統，今古之常經，常經之外更無所陳。大抵能守常經，則雖屬艱虞，而猶可以保國。若邊用權道，則群情不服而多致患難。今者擧國之係望於元孫已久，若聞此言，則中外人心，必皆波蕩，甚可懼也。", special: "objection", stance: -12 },
            { speaker: "上", text: "我世祖不傳於元孫，傳於睿宗，當時朝臣無異議，果皆不忠者耶？大臣當國家之大事，宜任其責，而徒以循常之談，為塞責之地，此豈大臣之道耶？", special: "shake", stance: 10 },
            { speaker: "上", text: "（謂瑬曰）此事專在於領相，卿其決之。", special: "flash", stance: 10 },
            { speaker: "瑬", text: "臣雖忝首相，顧安敢獨斷乎？若明知宗社存亡決於此舉，則群臣固無敢異議者，而今日之舉，未見其必係於存亡，而欲行非常之道，此臣等之所以不敢輕議也。", stance: -5 },
            { speaker: "上", text: "古之大臣擔當國事，不知有其身. 我太宗朝讓寧大君之在東宮也，百官請廢之，至於庭請，是皆以國為重，而不顧後患者也. 若使太宗不許，則後日之禍有不可測，而猶且為之. 今卿等知其可，而不肯言，何也？", special: "speed", stance: 8 },
            { speaker: "瑬", text: "德宗在東宮，昇遐於天順丁丑，而睿宗繼統於戊子，則當時成宗年十二歲矣，月山大君又加長矣，而光廟之建儲如此，未知何故也。", stance: -5 },
            { speaker: "上", text: "月山大君則性質不慧云，而當時成宗之年，亦已過十歲耶？", stance: 3 },
            { speaker: "瑬", text: "成宗生於丁丑德宗升遐之歲，故逮戊子世祖升遐之日，年十二矣。", stance: -2 },
            { speaker: "上", text: "以序言之，則當立者月山，而事有隨時變通者，故不得不如此爾。若以為常經不可不守，則世祖何以不傳於月山，而傳於睿宗，若以長幼言之，則睿宗何以舍月山，而立成廟耶？", special: "shake", stance: 12 },
            { speaker: "瑬", text: "當世祖之世，國家無事，而有此反常之擧，大聖人處事，誠未可量，此蓋出於擇賢耶？", stance: -3 },
            { speaker: "上", text: "世祖朝事，多危疑，故必欲立長君. 若出於擇賢，則成廟之聖，豈必不及於睿宗耶？予亦豈不知循序，而傳之之為至順也？第惟今日之勢，必須國有長君，然後可以保宗社之重也.", special: "speed", stance: 10 },
            { speaker: "德泂", text: "臣之意，亦以瑞鳳之言為然也。", stance: -5 },
            { speaker: "仁垕", text: "殿下之意，為宗社之大計，惟在聖斷耳。", stance: 5 },
            { speaker: "時白", text: "洪、李二大臣之言，俱是經常之道，臣則以兩臣之意為然也。", stance: -5 },
            { speaker: "景奭", text: "國有長君，雖曰社稷之福，無易樹之，乃是先王之典. 且國家安危之機，若能如燭照龜卜，則聖慮所在，不為無見，而若一行處變之舉，而反致四方之疑惑，則雖以利害言之，亦不知其可也。", special: "objection", stance: -10 },
            { speaker: "植", text: "書生之見，只守常道，寧知權變？", stance: -5 },
            { speaker: "上", text: "所謂書生，平日讀書，而不知用權之道，則雖腹有詩書，亦安用哉？且今日定策，豈如權謀術數之難知者耶？", special: "shake", stance: 8 },
            { speaker: "植", text: "守經而宗社必危，行權而國家可安，則此舉未為不可，而臣恐不守經，則反不得安也。", stance: -5 },
            { speaker: "壽賢", text: "國家重事，不可以一二人之見決之，須熟講於大臣而為之。", stance: -3 },
            { speaker: "堉", text: "世祖朝國家寧謐，故能行反常之舉，今日形勢異於當時，恐不可輕易行之也。", stance: -6 },
            { speaker: "太和", text: "臣之意與堉同矣。", stance: -4 },
            { speaker: "上", text: "兩司長官亦各言其意。", stance: 0 },
            { speaker: "楘", text: "三代以後，承統有序，若邊行權道，則必有大患矣。", special: "objection", stance: -8 },
            { speaker: "爾徵", text: "宗社之計，須與大臣議定，必欲問臣，但有守經而已。", stance: -10 },
            { speaker: "上", text: "（厲聲曰）此事必須與大臣決之. 卿等但為此常談，一朝若不諱，卿等何以為計耶？", special: "shake", stance: 15 },
            { speaker: "自點", text: "此舉出於聖上之深思慮，宜速斷定，何必持難耶？", stance: 10 },
            { speaker: "上", text: "大臣之議，每以經常二字為執言之地，含糊傳會. 棄職而去宜矣！士君子行己處心，豈可如是黠鼠耶？", special: "shake", stance: 12 },
            { speaker: "悦", text: "以經常言之，則臣民之屬望，自有所載. 不意今日有此非常之舉，故臣等之言如是矣. 若以為宗社臣民，必如是而可安，則亦豈無行權之道乎？", stance: -5 },
            { speaker: "敬輿", text: "上意雖以元孫之幼沖，思得長君，而非常之舉，豈敢易議？且論其長幼，不若論其賢否. 今也聖教，不及於元孫之賢否，而只以長幼為言. 自古幼年嗣位，成德保邦者，亦非一二，豈可以年之幼沖，而輕易廢立耶？", stance: -10 },
            { speaker: "敬輿", text: "元孫之在膝下已久，其賢不肖，想已洞燭，而外庭之臣無由得知. 今日臣民，皆已屬望於元孫，知有世嫡之當承而已. 若反常行權，而宗社永賴，則其在古昔，亦有此事，帝王經常之典，臣亦知其不可膠守矣。", special: "objection", stance: -8 },
            { speaker: "悦", text: "今日諸臣之所以持難不決者，非過也. 世子既沒，則當繼者元孫也. 國本之易樹，豈可立決於一言乎？", stance: -6 },
            { speaker: "德泂", text: "既正元孫之名，又立輔養之官，則位號之定久矣. 經常不易之典，可考信於往牒也. 人臣之道，猝當反常之舉，當以守經爭之乎，抑將以處權順之乎？今日聖教，雖以宗社之計為言，而猝然一朝，欲易已正之名號，群臣若靡然從之，則將焉用彼臣為哉？", special: "objection", stance: -12 },
            { speaker: "上", text: "（默然良久曰）大臣之意，則皆歸於一耶？", special: "flash", stance: 5 },
            { speaker: "瑬", text: "似無異議也。", stance: 10 },
            { speaker: "上", text: "不幸諸子皆沒，只有二人，大臣擇賢而定之。此非嫡長之比，唯當擇其賢耳。", stance: 8 },
            { speaker: "瑞鳳", text: "大君與朝臣，無相接之事，何能知其優劣乎？古人云：『知子莫如父. 』此在睿斷而已。", stance: 5 },
            { speaker: "上", text: "二人皆劣，無所取舍。予欲立長，未知何如？", stance: 12 },
            { speaker: "瑬", text: "立嫡以長，順也。", stance: 10 },
            { speaker: "上", text: "然. 清使將來，必問國本，故不得不急急議定耳.", special: "speed", stance: 10 },
            { speaker: "瑬", text: "此外更無可議，須明白下教，使群臣明知之。", stance: 5 },
            { speaker: "上", text: "以鳳林大君為世子。", special: "flash", stance: 20 },
            { speaker: "自點", text: "當捧承傳乎？", stance: 5 },
            { speaker: "史官", text: "（左右竊笑）上曰：『無庸為也。』瑬請令禮曹奉行，上曰：『徐為之未晚也。』", stance: 0 }
        ];

        // 核心對齊補償表 (x%, y%)
        const offsets = {
            "瑞鳳": { x: '2%', y: '12%' }, "敬輿": { x: '5%', y: '12%' }, "植": { x: '0%', y: '18%' },
            "爾徵": { x: '-3%', y: '12%' }, "德泂": { x: '0%', y: '12%' }, "仁垕": { x: '0%', y: '12%' },
            "悦": { x: '0%', y: '12%' }, "壽賢": { x: '0%', y: '12%' }, "太和": { x: '0%', y: '12%' }
        };

        const ministersData = {
            "瑬": { px: '12.5%', py: '0%', group: 'a' }, "自點": { px: '50%', py: '0%', group: 'a' },
            "瑞鳳": { px: '25%', py: '0%', group: 'b' }, "敬輿": { px: '62.5%', py: '0%', group: 'b' },
            "景奭": { px: '75%', py: '100%', group: 'b' }, "堉": { px: '100%', py: '0%', group: 'b' },
            "悦": { px: '37.5%', py: '0%', group: 'c' }, "壽賢": { px: '87.5%', py: '0%', group: 'c' },
            "太和": { px: '0%', py: '100%', group: 'c' }, "楘": { px: '100%', py: '100%', group: 'c' },
            "爾徵": { px: '25%', py: '100%', group: 'c' }, "德泂": { px: '37.5%', py: '100%', group: 'c' },
            "仁垕": { px: '50%', py: '100%', group: 'c' }, "時白": { px: '62.5%', py: '100%', group: 'c' },
            "植": { px: '75%', py: '0%', group: 'c' }
        };

        let currentIndex = -1;
        let isTyping = false;
        let typingTimer = null;
        let currentStanceBalance = 50;

        function typeText(element, text) {
            if (typingTimer) clearInterval(typingTimer);
            isTyping = true; element.innerHTML = "";
            let i = 0;
            typingTimer = setInterval(() => {
                if (i < text.length) { element.innerHTML += text.charAt(i); i++; }
                else { clearInterval(typingTimer); element.innerHTML = formatText(element.innerHTML); isTyping = false; }
            }, 30);
        }

        function triggerSpecial(type) {
            const stage = document.getElementById('main-stage');
            const flash = document.getElementById('flash');
            const speed = document.getElementById('speed-lines');
            const bubble = document.getElementById('objection-bubble');
            if (type === "shake") { stage.classList.add('shake-screen'); setTimeout(() => stage.classList.remove('shake-screen'), 400); }
            else if (type === "flash") { flash.classList.add('flash-active'); setTimeout(() => flash.classList.remove('flash-active'), 300); }
            else if (type === "speed") { speed.classList.add('active'); setTimeout(() => speed.classList.remove('active'), 1000); }
            else if (type === "objection") { bubble.classList.add('show'); flash.classList.add('flash-active'); stage.classList.add('shake-screen'); setTimeout(() => { bubble.classList.remove('show'); flash.classList.remove('flash-active'); stage.classList.remove('shake-screen'); }, 800); }
        }

        function updateUI() {
            const entry = dialogue[currentIndex];
            document.getElementById('speaker').innerText = entry.speaker;
            typeText(document.getElementById('speech'), entry.text);
            if (entry.special) triggerSpecial(entry.special);
            
            currentStanceBalance += (entry.stance || 0);
            currentStanceBalance = Math.max(10, Math.min(90, currentStanceBalance));
            document.getElementById('bar-traditional').style.width = (100 - currentStanceBalance) + '%';
            document.getElementById('bar-reform').style.width = currentStanceBalance + '%';

            document.querySelectorAll('.character').forEach(c => c.classList.remove('active'));
            if (entry.speaker === "上") document.getElementById('char-king').classList.add('active');
            else if (ministersData[entry.speaker]) document.getElementById(`char-${entry.speaker}`).classList.add('active');
            if (entry.text.includes("鳳林大君")) document.getElementById('char-bongnim').classList.add('active');
            if (entry.text.includes("麟坪大君")) document.getElementById('char-inpyeong').classList.add('active');
            if (entry.text.includes("元孫") || entry.text.includes("世孫")) document.getElementById('char-sesun').classList.add('active');
            document.getElementById('btn-prev').disabled = (currentIndex <= 0);
        }

        function nextDialogue() {
            if (isTyping) { clearInterval(typingTimer); document.getElementById('speech').innerHTML = formatText(dialogue[currentIndex].text); isTyping = false; return; }
            if (currentIndex < dialogue.length - 1) { currentIndex++; updateUI(); }
        }

        function prevDialogue() {
            if (isTyping) clearInterval(typingTimer);
            if (currentIndex > 0) {
                currentIndex--;
                currentStanceBalance = 50;
                for(let i=0; i<=currentIndex; i++) { currentStanceBalance += (dialogue[i].stance || 0); }
                currentStanceBalance = Math.max(10, Math.min(90, currentStanceBalance));
                updateUI();
            }
        }

        function showWiki(term) { document.getElementById('wiki-title').innerText = term; document.getElementById('wiki-content').innerText = wikiData[term]; document.getElementById('wiki-modal').style.display = 'block'; document.getElementById('wiki-overlay').style.display = 'block'; }
        function closeWiki() { document.getElementById('wiki-modal').style.display = 'none'; document.getElementById('wiki-overlay').style.display = 'none'; }
        function formatText(text) { let res = text; Object.keys(wikiData).forEach(k => { res = res.replace(new RegExp(k, 'g'), `<span class="term" onclick="event.stopPropagation(); showWiki('${k}')">${k}</span>`); }); return res; }

        function init() {
            Object.keys(ministersData).forEach(name => {
                const data = ministersData[name];
                const grid = document.getElementById('min-' + data.group);
                const div = document.createElement('div');
                div.className = 'character minister avatar-container';
                div.id = `char-${name}`;
                const off = offsets[name] || { x: '0%', y: '12%' };
                div.innerHTML = `<div class="avatar-circle"><div class="avatar-img" style="background-position: ${data.px} ${data.py}; transform: scale(2.6) translate(${off.x}, ${off.y});"></div></div><div class="name-tag">${name}</div>`;
                grid.appendChild(div);
            });
            document.getElementById('dialogue-box').addEventListener('click', nextDialogue);
            document.getElementById('btn-next').addEventListener('click', nextDialogue);
            document.getElementById('btn-prev').addEventListener('click', (e) => { e.stopPropagation(); prevDialogue(); });
            window.addEventListener('keydown', (e) => { if (e.code === "Space") { e.preventDefault(); nextDialogue(); } else if (e.code === "ArrowLeft" || e.code === "Backspace") { prevDialogue(); } });
        }
        window.onload = init;
    </script>
</body>
</html>
